<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weather">
<meta name="theme-color" content="#F2C14E">
<title>Weather</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500;600;700&family=Noto+Sans+KR:wght@500;600;700&display=swap">
<style>
  :root {
    --bg: #F2C14E; --fg: #141414; --graph: #8FB8DE;
    --display: "Anton", "Noto Sans KR", sans-serif;
    --sans: "Poppins", "Noto Sans KR", system-ui, sans-serif;
    --mono: "Poppins", "Noto Sans KR", system-ui, sans-serif; /* data lines: same family as text, set at 500 */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--sans);
    letter-spacing: -.02em; /* Poppins runs wide: tighten every text a little (Anton numbers reset to 0) */
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .4s ease, color .4s ease;
  }
  body[data-state="sun"]        { --bg: #F2C14E; --fg: #141414; }
  body[data-state="rain"]       { --bg: #4F5D6B; --fg: #E6ECF2; --graph: #8FB8DE; }
  body[data-state="night"]      { --bg: #1B2140; --fg: #F4F1E8; }
  body[data-state="snow"]       { --bg: #E9EEF3; --fg: #141414; --graph: #5C7A99; }
  body[data-state="overcast"]   { --bg: #A9B1B9; --fg: #141414; }
  body[data-state="night"][data-wx="snow"] { --graph: #BCC8D4; }

  .app {
    max-width: 480px; margin: 0 auto; min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 28px);
  }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .city { font-size: 17px; font-weight: 700; }
  .date { font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .02em; margin-top: 2px; }
  .loc {
    width: 44px; height: 44px; border-radius: 22px; padding: 0;
    border: 1.5px solid var(--fg); background: transparent; color: var(--fg);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  /* Full-bleed: the 240×170 drawing stays centered at the same size, drifting clouds cross the whole screen width */
  .hero-art { display: flex; justify-content: center; margin: 28px -24px 0; height: 170px; overflow: hidden; }
  .hero-art svg { width: 100%; height: 170px; }
  /* Hero art motion (loops) */
  .art-drop { opacity: 0; animation: art-fall .9s linear infinite; }
  @keyframes art-fall { 0% { opacity: 0; transform: translate(3px,-14px); } 15%,85% { opacity: 1; } 100% { opacity: 0; transform: translate(-5px,16px); } }
  .art-sun { transform-origin: 120px 80px; animation: art-glow 2.6s ease-in-out infinite; }
  .art-sun-sm { transform-origin: 168px 54px; }
  @keyframes art-glow { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .art-rays { transform-origin: 120px 80px; animation: art-spin 18s linear infinite; }
  .art-rays line { animation: art-ray 1.6s ease-in-out infinite; }
  .art-rays line:nth-child(even) { animation-delay: .8s; }
  @keyframes art-spin { to { transform: rotate(360deg); } }
  @keyframes art-ray { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .art-bob { animation: art-bob 5s ease-in-out infinite; }
  @keyframes art-bob { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
  .art-drift { animation: art-drift linear infinite; }
  @keyframes art-drift { from { transform: translateX(-200px); } to { transform: translateX(440px); } }
  .art-star { animation: art-tw 2.4s ease-in-out infinite; }
  @keyframes art-tw { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
  .art-flake { opacity: 0; animation: art-snow 3s linear infinite; }
  @keyframes art-snow { 0% { opacity: 0; transform: translate(0,-16px); } 15%,85% { opacity: 1; } 50% { transform: translate(5px,6px); } 100% { opacity: 0; transform: translate(-3px,30px); } }
  @media (prefers-reduced-motion: reduce) { .hero-art svg * { animation: none !important; } .art-drop, .art-flake { opacity: 1; } }
  .temp {
    font-family: var(--display); font-size: 240px; line-height: .86;
    text-align: center; letter-spacing: -4px; margin-top: 8px; white-space: nowrap;
  }
  .temp.long { font-size: 190px; }
  .deg { font-size: .8em; position: relative; top: -.29em; }
  .cond {
    position: relative; text-align: center; font-size: 40px; font-weight: 700;
    line-height: 1.1; letter-spacing: -.02em; margin-top: -20px; text-transform: uppercase;
    text-shadow: 3px 0 var(--bg), -3px 0 var(--bg), 0 3px var(--bg), 0 -3px var(--bg),
                 2px 2px var(--bg), -2px -2px var(--bg), 2px -2px var(--bg), -2px 2px var(--bg);
  }
  .sub { text-align: center; font-family: var(--mono); font-weight: 500; font-size: 12px; letter-spacing: .02em; margin-top: 10px; }
  .grow { flex-grow: 1; min-height: 24px; }

  /* Feels-like block: animated person + feels-like temperature + band name */
  /* cursor: pointer also makes iOS Safari deliver taps on this non-button area */
  .head-tap { cursor: pointer; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; outline: none; }
  .feels {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    margin-top: 14px; padding: 8px 0; border: 0;
    width: 100%; background: none; color: inherit; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  /* person matches the digits: head top = digit top, feet = baseline (Anton 56px digits are ~49px tall) */
  /* round badge in the band color, white person inside; text stays the screen's text color */
  .feels-ic {
    width: 56px; height: 56px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--badge); color: #FFFFFF; --bg: var(--badge); --graph: #FFFFFF;
  }
  /* the person sits left of the 30-unit box's center (body 1.5–24.5, head–feet 2–29): nudge it to the badge's middle */
  .feels-ic svg { width: 38px; height: 38px; flex: none; overflow: visible; position: relative; left: 2.5px; top: -.6px; }
  .feels-n { font-family: var(--display); letter-spacing: 0; font-size: 56px; line-height: 1; }
  .feels-t { text-align: left; }
  .feels-t span { display: block; text-transform: uppercase; }
  .feels-b { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .feels-l { font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .02em; margin-bottom: 2px; }
  .person-ic .fg { fill: currentColor; }
  .person-ic .st { stroke: currentColor; fill: none; stroke-linecap: round; }
  .person-ic .rain { stroke: var(--graph); }
  .person-ic .hd { stroke: var(--bg); stroke-width: 1.6px; paint-order: stroke; }
  .person-ic .fx { opacity: 0; }
  /* animations loop while .play is set (always, after each render) */
  .play.b-freeze .ps { transform-origin: 13px 29px; animation: hunch 2.4s ease-in-out infinite; }
  .play.b-freeze .breath, .play.b-verycold .breath, .play.b-cold .breath { animation: breath 2.4s ease-out infinite; }
  .play.b-verycold .ps { animation: shiver 1.6s linear infinite; }
  .play.b-cold .ps { animation: shiver 2.8s linear infinite; }
  .play.b-chilly .gust { animation: gust 3.4s ease-in infinite; }
  .play.b-chilly .gust:nth-child(2) { animation-delay: .2s; }
  .play.b-chilly .body { transform-origin: 13px 29px; animation: wrap 3.4s ease-in-out infinite; }
  .play.b-chilly .hd, .play.b-chilly .hair { animation: nod 3.4s ease-in-out infinite; }
  .play.b-cool .body, .play.b-pleasant .body { transform-origin: 13px 29px; animation: breathe 3.2s ease-in-out infinite; }
  .play.b-pleasant .ps, .play.b-warm .ps { transform-origin: 13px 29px; animation: sway 2.8s ease-in-out infinite; }
  .play.b-hot .drop1, .play.b-scorching .drop1 { animation: drop 2s ease-in infinite; }
  .play.b-scorching .drop2 { animation: drop 2s ease-in .9s infinite; }
  .play.b-scorching .ps { transform-origin: 13px 29px; animation: droop 3s ease-in-out infinite; }
  .play.windy .lean { transform-origin: 13px 29px; animation: lean 2.2s ease-in-out infinite; }
  .play.windy .hair path { transform-origin: 10px 4px; animation: hair 1.1s ease-in-out infinite; }
  .play.wet .rd { animation: rd 1s linear infinite; }
  .play.wet .rd:nth-child(2) { animation-delay: .35s; } .play.wet .rd:nth-child(3) { animation-delay: .7s; }
  .play.snowy .fl { animation: fl 2.6s linear infinite; }
  .play.snowy .fl:nth-child(2) { animation-delay: .9s; } .play.snowy .fl:nth-child(3) { animation-delay: 1.7s; }
  @keyframes hunch { 0%,100% { transform: scale(1); } 40%,70% { transform: scale(1.04, .93); } }
  @keyframes breath { 0%,35% { opacity: 0; transform: scale(.6); } 50% { opacity: .9; } 80%,100% { opacity: 0; transform: translate(4px,-3px) scale(1.2); } }
  @keyframes shiver { 0%,4%,8%,12%,16%,20%,24%,28% { transform: translateX(-.7px); } 2%,6%,10%,14%,18%,22%,26% { transform: translateX(.7px); } 30%,100% { transform: none; } }
  /* chilly: a gust passes once, then the body pulls in and holds */
  @keyframes gust { 0% { opacity: 0; transform: translateX(-12px); } 8% { opacity: 1; } 30% { opacity: 0; transform: translateX(4px); } 100% { opacity: 0; transform: translateX(4px); } }
  @keyframes wrap { 0%,22% { transform: none; } 38%,72% { transform: scale(.86, 1); } 90%,100% { transform: none; } }
  @keyframes nod { 0%,22% { transform: none; } 38%,72% { transform: translate(.6px, 1.4px); } 90%,100% { transform: none; } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04, 1.06); } }
  @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes drop { 0%,20% { opacity: 0; transform: translateY(0); } 30% { opacity: 1; } 80% { opacity: 1; transform: translateY(9px); } 100% { opacity: 0; transform: translateY(11px); } }
  @keyframes droop { 0%,100% { transform: none; } 50% { transform: scale(1.03, .95); } }
  @keyframes lean { 0%,100% { transform: rotate(2deg); } 50% { transform: rotate(5deg); } }
  @keyframes hair { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-14deg) translateX(-1px); } }
  @keyframes rd { from { opacity: 1; transform: translate(0,-4px); } to { opacity: 0; transform: translate(-2px,6px); } }
  @keyframes fl { from { opacity: 0; transform: translateY(-6px); } 20% { opacity: 1; } to { opacity: 0; transform: translateY(10px); } }
  @media (prefers-reduced-motion: reduce) { .person-ic * { animation: none !important; } }

  .line { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; padding: 14px 0; }
  .line svg { flex: none; }
  .graph { padding: 14px 0 12px; display: flex; flex-direction: column; gap: 10px; }
  .graph-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .graph-title { font-size: 14px; font-weight: 700; }
  .graph-max { font-family: var(--mono); font-weight: 500; font-size: 12px; white-space: nowrap; }
  .bars { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; align-items: end; height: 48px; }
  .bars div { background: var(--graph); min-height: 4px; }
  .ticks { display: flex; justify-content: space-between; font-family: var(--mono); font-weight: 500; font-size: 10px; }

  .hours-wrap { border-top: 1.5px solid var(--fg); }
  .hours {
    display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
    margin: 0 -24px; padding: 14px 24px;
  }
  .hours::-webkit-scrollbar { display: none; }
  .hour { flex: none; width: 48px; padding: 8px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .hour.now .hour-v { position: relative; }
  .hour.now .hour-v::after {
    content: ""; position: absolute; left: 50%; bottom: -4px;
    width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: currentColor;
  }
  .hour-t { font-family: var(--mono); font-weight: 500; font-size: 11px; line-height: 14px; }
  .hour-v { font-family: var(--display); letter-spacing: 0; font-size: 22px; }
  .hour-p { font-family: var(--mono); font-weight: 500; font-size: 10px; min-height: 12px; }
  .days {
    border-top: 1.5px solid var(--fg); padding-top: 14px;
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; text-align: center;
  }
  .day { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .day-name { font-family: var(--mono); font-weight: 500; font-size: 11px; }
  .day-temp { font-family: var(--display); letter-spacing: 0; font-size: 22px; }
  .status { font-family: var(--mono); font-weight: 500; font-size: 10px; text-align: center; margin-top: 12px; opacity: .8; min-height: 12px; }
  [hidden] { display: none !important; }

  /* Today's Look sheet (opens from the feels-like block) */
  .look {
    position: fixed; inset: 0; z-index: 10; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    /* iOS-style glass: the band color, see-through, over the main screen blurred underneath (body.look-open) */
    background: var(--lk-tint);
    color: var(--lk-ink); --bg: var(--lk-bg); --ink: var(--lk-ink); --graph: var(--lk-ink); /* rain drops on the person follow the ink here so they show on every band color */
    padding: calc(env(safe-area-inset-top) + 8px) 24px calc(env(safe-area-inset-bottom) + 36px);
    transform: translateY(100%); transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .look.open { transform: none; }
  .app { transition: filter .35s ease, transform .35s ease; }
  body.look-open .app { filter: blur(26px) saturate(1.5); transform: scale(1.06); }
  .look.dragging { transition: none; }
  .look > * { max-width: 432px; margin-left: auto; margin-right: auto; }
  .lk-grab { display: block; width: 100%; height: 28px; background: none; border: 0; position: relative; cursor: pointer; }
  .lk-grab::before { content: ""; position: absolute; left: 50%; top: 10px; width: 44px; height: 5px; margin-left: -22px; border-radius: 3px; background: var(--lk-ink); opacity: .45; }
  .lk-mast { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-top: 8px; }
  .lk-ic { margin-top: 22px; }
  /* same round badge as the main block, a little larger; offsets scale with the icon (2.5 / -.6 at 38px) */
  .lk-ic .feels-ic { width: 64px; height: 64px; }
  .lk-ic .feels-ic svg { width: 43px; height: 43px; left: 2.8px; top: -.7px; }
  .lk-kicker { margin-top: 10px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .lk-head { font-family: var(--display); font-size: 92px; line-height: .88; letter-spacing: -1px; text-transform: uppercase; margin-top: 8px; }
  .lk-deck { font-size: 20px; font-weight: 700; line-height: 1.3; margin-top: 14px; }
  /* outfit photo between the deck and the items; plain, no frame */
  /* the sheet crops are small (~75px wide), so keep them at about half width until full-size photos arrive */
  .lk-photo { display: block; width: 56%; height: auto; margin-top: 22px; background: rgba(20,20,20,.06); }
  .lk-baby .lk-photo { margin-top: 14px; }
  /* chilly sheet (look/chilly/): one large look photo, then the pieces as a 3-column grid */
  .lk-hero { width: 100%; }
  .lk-pieces { margin-top: 22px; }
  .lk-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 8px; margin-top: 10px; }
  .lk-piece img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: contain; background: #FFFFFF; }
  .lk-piece span { display: block; margin-top: 5px; font-size: 11px; font-weight: 600; line-height: 1.3; }
  .lk-items { margin-top: 18px; }
  .lk-item { padding: 8px 0; }
  .lk-cat { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .lk-what { font-size: 16px; font-weight: 700; line-height: 1.3; margin-top: 1px; }
  .lk-quote { margin-top: 24px; font-size: 26px; font-weight: 700; line-height: 1.2; }
  .lk-quote small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
  .lk-baby { margin-top: 30px; }
  .lk-bt { font-family: var(--display); letter-spacing: 0; font-size: 34px; line-height: .9; text-transform: uppercase; }
  .lk-baby p { margin: 10px 0 0; font-size: 14px; font-weight: 600; line-height: 1.45; }
  .lk-foot { margin-top: 28px; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
  .lk-foot button, .lk-skip { font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; background: none; border: 0; padding: 6px 0; cursor: pointer; }
  .lk-q { margin-top: 26px; }
  .lk-ask { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .lk-opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .lk-opt { position: relative; font: 600 15px var(--sans); color: var(--lk-ink); background: none; border: 0; padding: 10px 16px; border-radius: 22px; cursor: pointer; }
  .lk-opt::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--lk-ink); opacity: .12; }
  .lk-opt.on { color: var(--lk-bg); }
  .lk-opt.on::before { opacity: 1; }
  .lk-opt span { position: relative; }
  .lk-go { display: block; margin-top: 34px; width: 100%; font: 700 17px var(--sans); color: var(--lk-bg); background: var(--lk-ink); border: 0; border-radius: 28px; padding: 17px; cursor: pointer; transition: opacity .2s; }
  .lk-go:disabled { opacity: .35; cursor: default; }
  .lk-fine { margin-top: 14px; font-size: 12px; font-weight: 500; line-height: 1.5; text-align: center; }
  .lk-skip { display: block; margin: 8px auto 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
</style>
</head>
<body data-state="sun">
<main class="app">
  <div class="head-tap" id="head-tap" role="button" tabindex="0" aria-label="Today's Look">
  <div class="top">
    <div>
      <div class="city" id="city">Berlin</div>
      <div class="date" id="date">&nbsp;</div>
    </div>
    <button class="loc" id="loc" type="button" aria-label="Use my location">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="hero-art" id="art" aria-hidden="true"></div>
  <div class="temp" id="temp">–</div>
  <div class="cond" id="cond">&nbsp;</div>
  <div class="sub" id="sub">&nbsp;</div>
  <div class="feels" id="feels">
    <span class="feels-ic" id="feels-ic"></span>
    <span class="feels-n" id="feels-n"></span>
    <span class="feels-t"><span class="feels-l" id="feels-l"></span><span class="feels-b" id="feels-b"></span></span>
  </div>
  </div>

  <div class="grow"></div>

  <div class="line" id="line" hidden></div>
  <div class="graph" id="graph" hidden>
    <div class="graph-head"><div class="graph-title" id="gtitle"></div><div class="graph-max" id="gmax"></div></div>
    <div class="bars" id="bars"></div>
    <div class="ticks" id="ticks"></div>
  </div>

  <div class="hours-wrap"><div class="hours" id="hours"></div></div>
  <div class="days" id="days"></div>
  <div class="status" id="status"></div>
</main>

<section class="look" id="look" role="dialog" aria-modal="true" aria-label="Today's Look" hidden>
  <button class="lk-grab" id="lk-grab" type="button" aria-label="Close"></button>
  <div class="lk-mast" id="lk-mast"></div>
  <div id="lk-body"></div>
</section>

<script>
(function () {
  "use strict";

  // ── Language (follows the device setting) ──
  var nav = (navigator.language || "en").toLowerCase();
  var LANG = nav.indexOf("de") === 0 ? "de" : nav.indexOf("ko") === 0 ? "ko" : "en";
  var LOCALE = { en: "en-GB", de: "de-DE", ko: "ko-KR" }[LANG];
  document.documentElement.lang = LANG;

  var T = {
    en: {
      berlin: "Berlin", here: "Current location", useLoc: "Use my location", useBerlin: "Show Berlin",
      feelsL: "Feels like", sub: "High {h}° · Low {l}° · Wind {w} km/h",
      noRain: "No rain in the next 12 hours", rainAt: "Rain likely around {t} · {p}%",
      tomorrow: "Tomorrow {t}: {v}° · {c}",
      rainFrom: "Rain from {t}", rainUntil: "Rain easing around {t}", rainOn: "Rain for the next 12 hours", rainLight: "Small chance of rain",
      snowFrom: "Snow from {t}", snowUntil: "Snow easing around {t}", snowOn: "Snow for the next 12 hours", snowLight: "Light snow possible",
      max: "Up to {p}%", total: "About {c} cm", now: "Now",
      updated: "Updated {t}", offline: "Offline · last update {t}", loading: "Loading…", failed: "Couldn't load the weather"
    },
    de: {
      berlin: "Berlin", here: "Aktueller Standort", useLoc: "Meinen Standort verwenden", useBerlin: "Berlin anzeigen",

      case "partly-cloudy-day": case "partly-cloudy-night": return (o.cloud_cover || 50) < 40 ? 1 : 2;
      case "cloudy": return 3;
      case "fog": return 45;
      case "rain": return 61;
      case "snow": return 73;
      case "sleet": return 66;
      case "hail": return 96;
      case "thunderstorm": return 95;

      var snow = state === "snow";
      var vals = hours.map(function (i) { return snow ? (H.snowfall[i] || 0) : (H.precipitation_probability[i] || 0); });
      var top = snow ? Math.max.apply(null, vals.concat([0.5])) : 100;
      $("bars").innerHTML = vals.map(function (v) { return '<div style="height:' + Math.max(4, Math.round(v / top * 48)) + 'px"></div>'; }).join("");
      var ticksAt = [0, 2, 4, 6, 8, 11];
      $("ticks").innerHTML = ticksAt.map(function (k) {
        if (k >= hours.length) return "<div></div>";
        return "<div>" + (k === 0 ? T.now : H.time[hours[k]].slice(11, 13)) + "</div>";
      }).join("");

      var wet = function (k) { var i = hours[k]; return snow ? (H.snowfall[i] || 0) >= 0.1 : (H.precipitation_probability[i] || 0) >= 50; };
      var title;
      if (wet(0)) {
        var endK = -1; for (var k = 1; k < hours.length; k++) { if (!wet(k)) { endK = k; break; } }
        title = endK > 0 ? fmt(snow ? T.snowUntil : T.rainUntil, { t: hourText(H.time[hours[endK]]) }) : (snow ? T.snowOn : T.rainOn);
      } else {
        var startK = -1; for (var k2 = 1; k2 < hours.length; k2++) { if (wet(k2)) { startK = k2; break; } }
        title = startK > 0 ? fmt(snow ? T.snowFrom : T.rainFrom, { t: hourText(H.time[hours[startK]]) }) : (snow ? T.snowLight : T.rainLight);
      }
      $("gtitle").textContent = title;
      if (snow) {
        var sum = vals.reduce(function (a, b) { return a + b; }, 0);
        $("gmax").textContent = fmt(T.total, { c: sum < 1 ? sum.toFixed(1).replace(".", LANG === "de" ? "," : ".") : Math.round(sum) });
      } else {
        $("gmax").textContent = fmt(T.max, { p: Math.max.apply(null, vals) });
      }
    } else {
      graph.hidden = true; line.hidden = false;
      var text;
      if (state === "night") {
        var morning = -1;
        for (var j = i0 + 1; j < H.time.length; j++) { if (parts(H.time[j]).h === 8) { morning = j; break; } }
        text = morning >= 0 ? fmt(T.tomorrow, { t: hourText(H.time[morning]), v: r(H.temperature_2m[morning]), c: condLabel(H.weather_code[morning], 1) }) : T.noRain;
        line.innerHTML = icon(morning >= 0 ? H.weather_code[morning] : 0) + "<span></span>";
      } else {
        var hit = -1;
        for (var m = 0; m < hours.length; m++) { if ((H.precipitation_probability[hours[m]] || 0) >= 50) { hit = hours[m]; break; } }
        text = hit >= 0 ? fmt(T.rainAt, { t: hourText(H.time[hit]), p: H.precipitation_probability[hit] }) : T.noRain;
        line.innerHTML = UMBRELLA + "<span></span>";
      }
      line.querySelector("span").textContent = text;
    }

    var hh = "";
    for (var n = 0; n < 24 && i0 + n < H.time.length; n++) {
      var x = i0 + n, pp = H.precipitation_probability[x] || 0;
      hh += '<div class="hour' + (n === 0 ? " now" : "") + '"><div class="hour-t">' + (n === 0 ? T.now : H.time[x].slice(11, 13)) + "</div>" +
            icon(H.weather_code[x], H.is_day[x] === 0) + '<div class="hour-v">' + r(H.temperature_2m[x]) + "°</div>" +
            '<div class="hour-p">' + (pp >= 20 ? pp + "%" : "") + "</div></div>";
    }
    $("hours").innerHTML = hh;
    $("hours").scrollLeft = 0;

    lastView = {
      data: data, band: band, f: f, i0: i0, theme: THEME[theme], color: LOOK_COLOR[band[1]],
      icon: '<span class="feels-ic" style="--badge:' + readableOn(BAND_COLOR[band[1]], "#FFFFFF", 1.5) + '">' +
        person(band[1], (cur.wind_speed_10m || 0) >= 30, isRain(cur.weather_code), isSnow(cur.weather_code)).replace('class="person-ic', 'class="play person-ic') + "</span>",
      dateLine: new Intl.DateTimeFormat(LOCALE, { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" }).format(asDate(cur.time)) + " · " + (place.gps ? T.here : T.berlin),
      updated: new Date(data._fetched).toTimeString().slice(0, 5)
    };
    if (lookOpen) openLook();

    var html = "";
    for (var d = 1; d <= 6 && d < D.time.length; d++) {
      html += '<div class="day"><div class="day-name">' + weekday(D.time[d]) + "</div>" + icon(D.weather_code[d]) +
              '<div class="day-temp">' + r(D.temperature_2m_max[d]) + "</div></div>";
    }
    $("days").innerHTML = html;

    var when = new Date(data._fetched).toTimeString().slice(0, 5);
    // Data from the last 20 minutes still counts as current, even if the latest request failed
    var old = stale && Date.now() - data._fetched > 20 * 60 * 1000;
    $("status").textContent = fmt(old ? T.offline : T.updated, { t: when }) + (measured ? " · DWD" : "") + " · " + BUILD;
  }

  // ── Place & data ──
  var BERLIN = { lat: 52.52, lon: 13.405, gps: false };
  function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }

  var place = load("wx-place") || BERLIN;

  function updateLocButton() {
    $("loc").setAttribute("aria-label", place.gps ? T.useBerlin : T.useLoc);
  }

  function url(p) {
    return "https://api.open-meteo.com/v1/forecast?latitude=" + p.lat + "&longitude=" + p.lon +
      "&current=temperature_2m,apparent_temperature,weather_code,is_day,wind_speed_10m,precipitation" +
      "&hourly=temperature_2m,precipitation_probability,snowfall,weather_code,is_day" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&minutely_15=precipitation&past_minutely_15=4&forecast_minutely_15=4" +
      "&timezone=auto&forecast_days=8";
  }

  // The home-screen app keeps running the page it loaded, so new builds never show up on their own.
  // Check the deployed page's BUILD and reload once when it differs (at most once a minute, once per build).
  var lastBuildCheck = 0;
  function checkBuild() {
    if (Date.now() - lastBuildCheck < 60000) return;
    lastBuildCheck = Date.now();
    fetch(location.pathname + "?build=" + Date.now(), { cache: "no-store" })
      .then(function (res) { return res.ok ? res.text() : ""; })
      .then(function (html) {
        var m = html.match(/var BUILD = "(b\d+)"/);
        if (!m || m[1] === BUILD) return;
        try { if (sessionStorage.getItem("wx-reloaded") === m[1]) return; sessionStorage.setItem("wx-reloaded", m[1]); } catch (e) {}
        // A new query string so the reload can't come back from the 10-minute HTTP cache of the old page.
        location.replace(location.pathname + "?v=" + m[1]);
      })
      .catch(function () {});
  }

  var busy = false, retryTimer = null, retries = 0;
  function refresh() {
    checkBuild();
    if (busy) return; busy = true;
    clearTimeout(retryTimer);
    var cached = load("wx-data");
    if (cached && !document.getElementById("days").innerHTML) render(cached, place, true);
    if (!cached) $("status").textContent = T.loading;
    // Forecast (Open-Meteo) and the latest station measurement (Bright Sky / DWD) in parallel;
    // the measurement is optional (outside Germany or when it fails the app runs on the forecast alone)
    var obsReq = fetch("https://api.brightsky.dev/current_weather?lat=" + place.lat + "&lon=" + place.lon, { cache: "no-store" })
      .then(function (res) { return res.ok ? res.json() : null; })
      .catch(function () { return null; });
    fetch(url(place), { cache: "no-store" })
      .then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); })
      .then(function (data) { return obsReq.then(function (bs) { if (bs && bs.weather) data.obs = bs.weather; return data; }); })
      .then(function (data) {
        if (!data.current) throw new Error("bad data");
        data._fetched = Date.now();
        store("wx-data", data);
        retries = 0;
        render(data, place, false);
      })
      .catch(function (err) {
        // iOS often fails the first request right after the app comes back to the foreground,
        // so try again a few seconds later (up to 3 times) instead of waiting 15 minutes.
        document.documentElement.dataset.lastError = String(err && err.message || err);
        var c = load("wx-data");
        if (c) render(c, place, true); else $("status").textContent = T.failed;
        if (retries < 3) { retries++; retryTimer = setTimeout(refresh, retries * 4000); }
      })
      .then(function () { busy = false; });
  }

  // The whole head (city, art, temperature, condition, feels-like) opens Today's Look; the location button keeps its own job
  $("head-tap").addEventListener("click", function (e) { if (!e.target.closest("#loc")) openLook(); });
  // Also open on a plain tap (touch released without moving), in case iOS swallows the click.
  // preventDefault stops the follow-up click from landing on the sheet that just opened under the finger.
  (function () {
    var head = $("head-tap"), t0 = null;
    head.addEventListener("touchstart", function (e) {
      var t = e.touches[0]; t0 = e.target.closest("#loc") ? null : { x: t.clientX, y: t.clientY, time: Date.now() };
    }, { passive: true });
    head.addEventListener("touchend", function (e) {
      if (!t0) return;
      var t = e.changedTouches[0], moved = Math.abs(t.clientX - t0.x) + Math.abs(t.clientY - t0.y);
      if (moved < 12 && Date.now() - t0.time < 600) { e.preventDefault(); openLook(); }
      t0 = null;
    });
  })();
  $("head-tap").addEventListener("keydown", function (e) { if ((e.key === "Enter" || e.key === " ") && !e.target.closest("#loc")) { e.preventDefault(); openLook(); } });
  $("lk-grab").addEventListener("click", closeLook);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeLook(); });
  // Swipe the sheet down from its top to close it
  (function () {
    var sheet = $("look"), y0 = null, dy = 0;
    sheet.addEventListener("touchstart", function (e) { y0 = sheet.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
    sheet.addEventListener("touchmove", function (e) {
      if (y0 === null) return;
      dy = e.touches[0].clientY - y0;
      if (dy > 0) { sheet.classList.add("dragging"); sheet.style.transform = "translateY(" + dy + "px)"; }
    }, { passive: true });
    sheet.addEventListener("touchend", function () {
      if (y0 === null) return;
      sheet.classList.remove("dragging");
      if (dy > 90) closeLook(); else sheet.style.transform = "";
      y0 = null;
    });
  })();

  $("loc").addEventListener("click", function () {
    if (place.gps) {
      place = BERLIN; store("wx-place", place); updateLocButton(); refresh(); return;
    }
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function (pos) {
      place = { lat: +pos.coords.latitude.toFixed(3), lon: +pos.coords.longitude.toFixed(3), gps: true };
      store("wx-place", place); updateLocButton(); refresh();
    }, function () {}, { maximumAge: 600000, timeout: 10000 });
  });

  updateLocButton();
  refresh();
  setInterval(refresh, 15 * 60 * 1000);
  window.addEventListener("online", function () { retries = 0; refresh(); });
  window.addEventListener("pageshow", function (e) { if (e.persisted) refresh(); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { $("hours").scrollLeft = 0; refresh(); } });
})();
</script>
</body>
</html>

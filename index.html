<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weather">
<meta name="theme-color" content="#F2C14E">
<title>Weather</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500;600;700&family=Noto+Sans+KR:wght@500;600;700&display=swap">
<style>
  :root {
    --bg: #F2C14E; --fg: #141414; --graph: #8FB8DE;
    --display: "Anton", "Noto Sans KR", sans-serif;
    --sans: "Poppins", "Noto Sans KR", system-ui, sans-serif;
    --mono: "Poppins", "Noto Sans KR", system-ui, sans-serif; /* data lines: same family as text, set at 500 */
    /* b105: one glass for every glass surface (Today's Look sheet, bottom menu), from the user's Figma Glass effect:
       fill white 50% · Frost 49 → backdrop blur 24px · Light -45° 80% → bright edge top-left, faint edge bottom-right ·
       Depth 20 → soft inner glow 20px. Refraction 80 / Dispersion 50 / Splay 0 have no Safari equivalent (no lens bending in CSS). */
    --glass-fill: rgba(255,255,255,.5);
    --glass-blur: blur(24px);
    --glass-light: inset 1.5px 1.5px 1px rgba(255,255,255,.8), inset -1px -1px 1px rgba(255,255,255,.2), inset 0 0 20px rgba(255,255,255,.16);
  }
  .glass { background: var(--glass-fill); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-light); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--sans);
    letter-spacing: -.02em; /* Poppins runs wide: tighten every text a little (Anton numbers reset to 0) */
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .4s ease, color .4s ease;
  }
  body[data-state="sun"]        { --bg: #F2C14E; --fg: #141414; }
  body[data-state="rain"]       { --bg: #4F5D6B; --fg: #E6ECF2; --graph: #8FB8DE; }
  body[data-state="night"]      { --bg: #1B2140; --fg: #F4F1E8; }
  body[data-state="snow"]       { --bg: #E9EEF3; --fg: #141414; --graph: #5C7A99; }
  body[data-state="overcast"]   { --bg: #A9B1B9; --fg: #141414; --oc-back: #958E81; --oc-drift: #91989F; }
  /* overcast days by how much daylight actually reaches the ground (shortwave radiation, W/m²) */
  body[data-state="overcast"][data-light="bright"] { --bg: #A3A091; --oc-back: #7F7A6E; --oc-drift: #7C8186; }
  body[data-state="overcast"][data-light="normal"] { --bg: #959B9E; --oc-back: #7E766C; --oc-drift: #7A8287; }
  body[data-state="overcast"][data-light="dim"]    { --bg: #948B82; --oc-back: #746B61; --oc-drift: #6F767B; }
  body[data-state="night"][data-wx="snow"] { --graph: #BCC8D4; }

  .app {
    max-width: 480px; margin: 0 auto; min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 28px);
  }
  /* city · date · time on one line at the top (b57) */
  .top { display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }
  /* tapping the city (name + pin icon, b123) opens the places sheet; padding widens the tap target without moving the text */
  .city { display: inline-flex; align-items: center; gap: 5px; font-size: 20px; font-weight: 700; cursor: pointer; padding: 10px 8px 10px 0; margin: -10px -8px -10px 0; }
  .city svg { width: 17px; height: 17px; flex: none; fill: currentColor; }
  .date { font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .02em; }
  /* Full-bleed: the 240×170 drawing stays centered at the same size, drifting clouds cross the whole screen width */
  .hero-art { display: flex; justify-content: center; margin: 31px -24px 0; height: 170px; overflow: hidden; }
  .hero-art svg { width: 100%; height: 170px; }
  /* Hero art motion (loops) */
  .art-drop { opacity: 0; animation: art-fall .9s linear infinite; }
  /* drizzle (b141): many fine short lines drifting down slowly across the whole screen width */
  .art-dz { opacity: 0; animation: art-dz 2s linear infinite; }
  @keyframes art-dz { 0% { opacity: 0; transform: translate(1px,-8px); } 25%,75% { opacity: .85; } 100% { opacity: 0; transform: translate(-2px,12px); } }
  /* showers (codes 80–82, b142): two groups of drops take turns, so the rain comes in bursts with short breaks */
  .art-on1 { animation: art-on1 3.2s step-end infinite; }
  .art-on2 { animation: art-on2 3.2s step-end infinite; }
  @keyframes art-on1 { 0% { visibility: visible; } 47% { visibility: hidden; } }
  @keyframes art-on2 { 0% { visibility: hidden; } 62% { visibility: visible; } 95% { visibility: hidden; } }
  @keyframes art-fall { 0% { opacity: 0; transform: translate(3px,-14px); } 15%,85% { opacity: 1; } 100% { opacity: 0; transform: translate(-5px,16px); } }
  .art-sun { transform-origin: 120px 80px; animation: art-glow 2.6s ease-in-out infinite; }
  .art-sun-sm { transform-origin: 168px 54px; }
  @keyframes art-glow { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .art-rays { transform-origin: 120px 80px; animation: art-spin 18s linear infinite; }
  .art-rays line { animation: art-ray 1.6s ease-in-out infinite; }
  .art-rays line:nth-child(even) { animation-delay: .8s; }
  @keyframes art-spin { to { transform: rotate(360deg); } }
  @keyframes art-ray { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .art-bob { animation: art-bob 5s ease-in-out infinite; }
  @keyframes art-bob { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
  .art-drift { animation: art-drift linear infinite; }
  @keyframes art-drift { from { transform: translateX(-200px); } to { transform: translateX(440px); } }
  .art-star { animation: art-tw 2.4s ease-in-out infinite; }
  @keyframes art-tw { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
  .art-fog { animation: art-fog 7s ease-in-out infinite alternate; }
  @keyframes art-fog { from { transform: translateX(-10px); } to { transform: translateX(10px); } }
  .art-flake { opacity: 0; animation: art-snow 3s linear infinite; }
  @keyframes art-snow { 0% { opacity: 0; transform: translate(0,-16px); } 15%,85% { opacity: 1; } 50% { transform: translate(5px,6px); } 100% { opacity: 0; transform: translate(-3px,30px); } }
  @media (prefers-reduced-motion: reduce) { .hero-art svg * { animation: none !important; } .art-drop, .art-dz, .art-flake { opacity: 1; } }
  .temp {
    font-family: var(--display); font-size: 240px; line-height: .86;
    text-align: center; letter-spacing: -4px; margin-top: 50px; white-space: nowrap;
  }
  .temp.long { font-size: 190px; }
  .deg { font-size: .8em; position: relative; top: -.29em; }
  .cond {
    position: relative; text-align: center; font-size: 40px; font-weight: 700;
    line-height: 1.1; letter-spacing: -.02em; margin-top: -20px; text-transform: uppercase;
    text-shadow: 3px 0 var(--bg), -3px 0 var(--bg), 0 3px var(--bg), 0 -3px var(--bg),
                 2px 2px var(--bg), -2px -2px var(--bg), 2px -2px var(--bg), -2px 2px var(--bg);
  }
  .sub { text-align: center; font-family: var(--mono); font-weight: 500; font-size: 12px; letter-spacing: .02em; margin-top: 16px; }
  .grow { flex-grow: 1; min-height: 24px; }

  /* Feels-like block: animated person + label/band name + feels-like temperature (b55 order) */
  /* cursor: pointer also makes iOS Safari deliver taps on this non-button area */
  .head-tap { cursor: pointer; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; outline: none; }
  .feels {
    display: flex; align-items: center; justify-content: center; gap: 21px;
    margin-top: 24px; padding: 8px 0; border: 0;
    width: 100%; background: none; color: inherit; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  /* person matches the digits: head top = digit top, feet = baseline (Anton 56px digits are ~49px tall) */
  /* round badge in the band color, white person inside; text stays the screen's text color */
  .feels-ic {
    width: 56px; height: 56px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--badge); color: #FFFFFF; --bg: var(--badge); --graph: #FFFFFF;
  }
  /* the person sits left of the 30-unit box's center (body 1.5–24.5, head–feet 2–29): nudge it to the badge's middle */
  .feels-ic svg { width: 38px; height: 38px; flex: none; overflow: visible; position: relative; left: 2.5px; top: -.6px; }
  /* main block: no badge, the person is drawn in the screen's text color (b59, Figma "App / corrections"); Today's Look keeps its badge */
  #feels .feels-ic { background: none; color: var(--fg); --bg: inherit; --graph: inherit; }
  .feels-n { font-family: var(--display); letter-spacing: 0; font-size: 56px; line-height: 1; }
  .feels-t { text-align: left; }
  .feels-t span { display: block; text-transform: uppercase; }
  .feels-b { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .feels-l { font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .02em; margin-bottom: 2px; }
  /* Today's summary: a bar in the feels-like band color, then the text (b59, Figma "App / corrections") */
  .summary { display: flex; align-items: stretch; gap: 7px; margin-top: 23px; word-break: keep-all; font-size: 16px; font-weight: 700; line-height: 1.5; letter-spacing: .2px; }
  .summary[hidden] { display: none; }
  .summary-bar { flex: none; width: 7px; background: var(--badge); }
  /* today's outfit on the main screen, opens Today's Look (b68). b77: type only, between the feels-like block and the summary —
     "Today's Look" over the band headline in Anton (b76 chevron removed) */
  .peek { display: block; width: 100%; margin-top: 28px; padding: 0; border: 0; background: none; color: inherit;
    font: inherit; letter-spacing: inherit; text-align: left; cursor: pointer; }
  .peek-k { display: block; font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .peek-d[hidden] { display: none; }
  .peek-d { display: block; margin-top: 6px; font-family: var(--display); font-size: 56px; line-height: .9; letter-spacing: 0; text-transform: uppercase; }
  /* b135: always two lines (split where the lines come out most even), 56px, smaller only if a line would not fit */
  .peek-d span { display: block; white-space: nowrap; }
  /* b133: the pick's hero product (b134: the one its title names, else the outer), background removed, behind the
     headline on the right (never down into the summary). b137: the letters that cross it keep the headline color */
  .peek { position: relative; }
  .peek-k, .peek-d { position: relative; }
  .peek-p { position: absolute; pointer-events: none; }
  .peek-p[hidden] { display: none; }
  .person-ic .fg { fill: currentColor; }
  .person-ic .st { stroke: currentColor; fill: none; stroke-linecap: round; }
  .person-ic .rain { stroke: var(--graph); }
  .person-ic .hd { stroke: var(--bg); stroke-width: 1.6px; paint-order: stroke; }
  .person-ic .fx { opacity: 0; }
  /* animations loop while .play is set (always, after each render) */
  .play.b-freeze .ps { transform-origin: 13px 29px; animation: hunch 2.4s ease-in-out infinite; }
  .play.b-freeze .breath, .play.b-verycold .breath, .play.b-cold .breath { animation: breath 2.4s ease-out infinite; }
  .play.b-verycold .ps { animation: shiver 1.6s linear infinite; }
  .play.b-cold .ps { animation: shiver 2.8s linear infinite; }
  .play.b-chilly .gust { animation: gust 3.4s ease-in infinite; }
  .play.b-chilly .gust:nth-child(2) { animation-delay: .2s; }
  .play.b-chilly .body { transform-origin: 13px 29px; animation: wrap 3.4s ease-in-out infinite; }
  .play.b-chilly .hd, .play.b-chilly .hair { animation: nod 3.4s ease-in-out infinite; }
  .play.b-cool .leaf { animation: fall 4s ease-in-out infinite; }
  .play.b-cool .body, .play.b-pleasant .body { transform-origin: 13px 29px; animation: breathe 3.2s ease-in-out infinite; }
  .play.b-pleasant .ps, .play.b-warm .ps { transform-origin: 13px 29px; animation: sway 2.8s ease-in-out infinite; }
  .play.b-hot .drop1, .play.b-scorching .drop1 { animation: drop 2s ease-in infinite; }
  .play.b-scorching .drop2 { animation: drop 2s ease-in .9s infinite; }
  .play.b-scorching .ps { transform-origin: 13px 29px; animation: droop 3s ease-in-out infinite; }
  .play.windy .lean { transform-origin: 13px 29px; animation: lean 2.2s ease-in-out infinite; }
  .play.windy .hair path { transform-origin: 10px 4px; animation: hair 1.1s ease-in-out infinite; }
  .play.wet .rd { animation: rd 1s linear infinite; }
  .play.wet .rd:nth-child(2) { animation-delay: .35s; } .play.wet .rd:nth-child(3) { animation-delay: .7s; }
  .play.snowy .fl { animation: fl 2.6s linear infinite; }
  .play.snowy .fl:nth-child(2) { animation-delay: .9s; } .play.snowy .fl:nth-child(3) { animation-delay: 1.7s; }
  @keyframes hunch { 0%,100% { transform: scale(1); } 40%,70% { transform: scale(1.04, .93); } }
  @keyframes breath { 0%,35% { opacity: 0; transform: scale(.6); } 50% { opacity: .9; } 80%,100% { opacity: 0; transform: translate(4px,-3px) scale(1.2); } }
  @keyframes shiver { 0%,4%,8%,12%,16%,20%,24%,28% { transform: translateX(-.7px); } 2%,6%,10%,14%,18%,22%,26% { transform: translateX(.7px); } 30%,100% { transform: none; } }
  /* chilly: a gust passes once, then the body pulls in and holds */
  @keyframes gust { 0% { opacity: 0; transform: translateX(-12px); } 8% { opacity: 1; } 30% { opacity: 0; transform: translateX(4px); } 100% { opacity: 0; transform: translateX(4px); } }
  @keyframes wrap { 0%,22% { transform: none; } 38%,72% { transform: scale(.86, 1); } 90%,100% { transform: none; } }
  @keyframes nod { 0%,22% { transform: none; } 38%,72% { transform: translate(.6px, 1.4px); } 90%,100% { transform: none; } }
  /* cool: one leaf turns as it falls beside the person (user picked B) */
  @keyframes fall { 0% { opacity: 0; transform: translate(0,-4px) rotate(0); } 12% { opacity: 1; } 35% { transform: translate(-3px,5px) rotate(-35deg); }
    60% { transform: translate(1px,13px) rotate(25deg); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-2px,21px) rotate(-20deg); } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04, 1.06); } }
  @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes drop { 0%,20% { opacity: 0; transform: translateY(0); } 30% { opacity: 1; } 80% { opacity: 1; transform: translateY(9px); } 100% { opacity: 0; transform: translateY(11px); } }
  @keyframes droop { 0%,100% { transform: none; } 50% { transform: scale(1.03, .95); } }
  @keyframes lean { 0%,100% { transform: rotate(2deg); } 50% { transform: rotate(5deg); } }
  @keyframes hair { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-14deg) translateX(-1px); } }
  @keyframes rd { from { opacity: 1; transform: translate(0,-4px); } to { opacity: 0; transform: translate(-2px,6px); } }
  @keyframes fl { from { opacity: 0; transform: translateY(-6px); } 20% { opacity: 1; } to { opacity: 0; transform: translateY(10px); } }
  @media (prefers-reduced-motion: reduce) { .person-ic * { animation: none !important; } }

  .line { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; padding: 14px 0; }
  .line svg { flex: none; }
  .graph { padding: 14px 0 12px; display: flex; flex-direction: column; gap: 10px; }
  .graph-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .graph-title { font-size: 14px; font-weight: 700; }
  .graph-max { font-family: var(--mono); font-weight: 500; font-size: 12px; white-space: nowrap; }
  .bars { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; align-items: end; height: 48px; }
  .bars div { background: var(--graph); min-height: 4px; }
  .ticks { display: flex; justify-content: space-between; font-family: var(--mono); font-weight: 500; font-size: 10px; }

  .hours {
    display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
    margin: 0 -24px; padding: 14px 24px;
  }
  .hours::-webkit-scrollbar { display: none; }
  .hour { flex: none; width: 48px; padding: 8px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  /* the "now" column: 5px dot above its label (b61) */
  .hour.now .hour-t { position: relative; }
  .hour.now .hour-t::before {
    content: ""; position: absolute; left: 50%; top: -8px;
    width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: currentColor;
  }
  .hour-t { font-family: var(--mono); font-weight: 500; font-size: 11px; line-height: 14px; }
  .hour-v { font-family: var(--display); letter-spacing: 0; font-size: 22px; }
  /* wind under the temperature (b87): icon with 1/2/3 lines for light (<20) / moderate (20–29) / strong (≥30 km/h) */
  .hour-w { display: flex; align-items: center; gap: 3px; height: 20px; font-family: var(--mono); font-weight: 600; font-size: 11px; line-height: 1; }
  .hour-w svg { width: 13px; height: 13px; flex: none; }
  /* precipitation chance under every hour (b60): bar on a common baseline, then the % ("-" under 20%) */
  .hour-pb { height: 32px; margin-top: 6px; display: flex; align-items: flex-end; }
  .hour-bar { width: 28px; background: #8FB8DE; }
  body[data-state="sun"] .hour-bar, body[data-state="overcast"] .hour-bar, body[data-state="snow"] .hour-bar { background: #CAE2F8; }
  .hour-p { font-family: var(--mono); font-weight: 500; font-size: 10px; min-height: 12px; }
  .status { font-family: var(--mono); font-weight: 500; font-size: 10px; text-align: center; margin-top: 12px; opacity: .8; min-height: 12px; }
  [hidden] { display: none !important; }

  /* Bottom menu (b88): a glass pill like the Today's Look sheet with the group switcher's ink pill for the open tab.
     Icons only (b89), Phosphor regular outline (b91). Scrolling down shrinks it; scrolling up (or reaching the top) brings it back. */
  .app, .page { padding-bottom: calc(env(safe-area-inset-bottom) + 112px); }
  .tabbar {
    position: fixed; z-index: 9; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 12px);
    display: flex; gap: 2px; padding: 5px; border-radius: 34px;
    width: min(calc(100% - 32px), 272px); transform: translateX(-50%); transform-origin: 50% 100%;
    color: #141414; transition: transform .3s cubic-bezier(.2,.8,.2,1), width .3s cubic-bezier(.2,.8,.2,1), opacity .25s ease;
  }
  .tabbar button {
    position: relative; flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center;
    padding: 11px 4px; border: 0; border-radius: 28px; background: none; color: inherit; cursor: pointer;
    transition: padding .3s cubic-bezier(.2,.8,.2,1), background-color .2s ease, color .2s ease;
  }
  .tabbar button.on { background: #141414; color: #FFFFFF; }
  .tabbar svg { width: 24px; height: 24px; flex: none; fill: currentColor; transition: width .3s ease, height .3s ease; }
  .tabbar .tab-dot { position: absolute; top: 8px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 50%; background: #D94448; }
  .tabbar.mini { width: min(calc(100% - 32px), 200px); }
  .tabbar.mini button { padding: 8px 4px; }
  .tabbar.mini svg { width: 20px; height: 20px; }
  .tabbar.mini .tab-dot { top: 5px; }
  body.look-open .tabbar { opacity: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .tabbar, .tabbar button, .tabbar svg { transition: none; } }

  /* Calendar · Alerts · Settings pages: same screen color as home, magazine type, no lines or cards */
  .page { max-width: 480px; margin: 0 auto; min-height: 100dvh; padding-top: calc(env(safe-area-inset-top) + 20px); padding-left: 24px; padding-right: 24px; }
  .pg-k { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .pg-h { font-family: var(--display); font-size: 64px; line-height: .9; letter-spacing: 0; text-transform: uppercase; margin-top: 10px; }
  .pg-list { margin-top: 26px; }
  .day { display: grid; grid-template-columns: 1fr 22px 46px 50px 78px; align-items: center; gap: 6px; padding: 11px 0; }
  .day-n { font-size: 16px; font-weight: 700; line-height: 1.15; }
  .day-n small { display: block; font-family: var(--mono); font-size: 11px; font-weight: 500; }
  .day svg { display: block; }
  .day-p, .day-w { font-family: var(--mono); font-weight: 600; font-size: 12px; }
  .day-w { display: flex; align-items: center; gap: 3px; }
  .day-w svg { width: 13px; height: 13px; flex: none; }
  .day-t { font-family: var(--display); font-size: 22px; letter-spacing: 0; text-align: right; white-space: nowrap; }
  .day-t span { opacity: .55; }
  /* Calendar (b93): the two titles are tabs, same Anton size; the one not shown is a tone lighter */
  .cal-tabs { display: flex; gap: 18px; margin: 10px -24px 0; padding: 0 24px; overflow-x: auto; scrollbar-width: none; }
  .cal-tabs::-webkit-scrollbar { display: none; }
  .cal-tabs button { flex: none; padding: 0; border: 0; background: none; color: inherit; cursor: pointer;
    font: 400 64px/.9 var(--display); letter-spacing: 0; text-transform: uppercase; opacity: .35; transition: opacity .2s; }
  .cal-tabs button.on { opacity: 1; }
  /* 7 Days as cards (b107, user picked proto/cal-cards.html): one card per day from tomorrow, swiped like the Today's Look
     photos — one card plus a third of the next, the next one 12% smaller. The card is that day's product cut (picked by the
     day's weather), its ivory ground is the card color; date, day, moving weather icon, temperature, rain and wind sit on top */
  .dc-dots { display: flex; gap: 6px; margin-top: 22px; }

  // Measured weather from the German Weather Service (DWD) stations via Bright Sky. When it is fresh

      case "thunderstorm": return 95;
      case "hail": return 96;
      case "snow": return 73;
      case "sleet": return 66;
      case "rain": return p >= 0.5 ? 63 : 61;
      case "fog": return 45;
    }
    switch (o.icon) {
      case "clear-day": case "clear-night": return (o.cloud_cover || 0) > 20 ? 1 : 0;
      case "partly-cloudy-day": case "partly-cloudy-night": return (o.cloud_cover || 50) < 40 ? 1 : 2;
      case "cloudy": return 3;
      case "fog": return 45;
      case "rain": return 61;
      case "snow": return 73;
      case "sleet": return 66;
      case "hail": return 96;
      case "thunderstorm": return 95;

  // The middle value decides clear / mostly clear / partly cloudy / overcast, so one source that is off can't
  // turn a few clouds into overcast. Rain, snow, fog and storms are left as they are.
  function metCloud(met) {
    var ts = met && met.properties && met.properties.timeseries;

    for (var i = 0; i < ts.length; i++) {
      if (Math.abs(new Date(ts[i].time).getTime() - Date.now()) <= 60 * 60000) {

  }
  // Is the sun actually out? (b125) Thin high cloud makes every source report 80–100 % cover on a sunny day, so
  // the vote alone calls it overcast. Use the share of sunshine instead when we have it: the DWD station's sunshine
  // minutes over the last 30 (or 60 / 10) minutes, else the model's direct share of the radiation (direct / total).
  function sunShare(data, measured) {

      if (typeof o.sunshine_60 === "number") return { share: o.sunshine_60 / 60, dwd: true };
      if (typeof o.sunshine_10 === "number") return { share: o.sunshine_10 / 10, dwd: true };
    }
    if (typeof cur.direct_radiation === "number" && typeof cur.shortwave_radiation === "number" && cur.shortwave_radiation >= 120)

    if (measured && data.obs && typeof data.obs.cloud_cover === "number") list.push(data.obs.cloud_cover);
    var m = metCloud(data.met);
    if (m !== null) list.push(m);
    if (typeof cur.cloud_cover === "number") list.push(cur.cloud_cover);
    if (list.length < 2 || cur.weather_code > 3) return null;
    list.sort(function (a, b) { return a - b; });
    var mid = list.length % 2 ? list[(list.length - 1) / 2] : (list[list.length / 2 - 1] + list[list.length / 2]) / 2;

  function rainNearby(data, nowLocal) {
    var M = data.minutely_15;
    if (!M || !M.time) return false;
    var t = new Date(nowLocal + ":00Z").getTime(), from = new Date(t - 30 * 60000).toISOString().slice(0, 16), to = new Date(t + 30 * 60000).toISOString().slice(0, 16);

  }

  function render(data, place, stale) {
    var measured = applyObs(data);
    if (measured) data = measured;
    var cur = data.current, H = data.hourly, D = data.daily;
    // Clock time at the place (the data's own time can be up to 15 min old)
    var nowLocal = typeof data.utc_offset_seconds === "number" ? new Date(Date.now() + data.utc_offset_seconds * 1000).toISOString().slice(0, 16) : cur.time;
    // The model's current code can say drizzle or rain while nothing falls. Show it as overcast only
    // when no rain is reported now, none in the 15-minute data from 30 min ago to 30 min ahead
    // (light rain rounds to 0.0 in a single 15-minute value), and the chance this hour is low.
    if (!measured && isRain(cur.weather_code) && typeof cur.precipitation === "number" && cur.precipitation < 0.1 && !rainNearby(data, nowLocal)) {
      var hNow = H.time.findIndex(function (x) { return x.slice(0, 13) === nowLocal.slice(0, 13); });
      if (hNow >= 0 && (H.precipitation_probability[hNow] || 0) < 40) {
        cur = Object.assign({}, cur, { weather_code: 3 });
        data = Object.assign({}, data, { current: cur });
      }
    }
    var cloud = cloudVote(data, measured);
    if (cloud) {

    // half sunny (≥45 %) → partly cloudy; rain and snow stay as they are
    var sun = cur.is_day === 1 && (cur.weather_code === 2 || cur.weather_code === 3 || isFog(cur.weather_code)) ? sunShare(data, measured) : null;
    if (sun && sun.share >= .45) {
      cur = Object.assign({}, cur, { weather_code: sun.share >= .75 ? 1 : 2 });
      data = Object.assign({}, data, { current: cur });
    }
    var isDay = cur.is_day === 1;
    var state = stateOf(cur.weather_code, isDay);
    // Colors: by weather during the day, one dark night color for every night (art and graphs still follow the weather)
    var theme = isDay ? state : "night";
    document.body.dataset.state = theme;
    document.body.dataset.wx = state;
    var light = theme === "overcast" ? lightOf(cur.shortwave_radiation) : null;
    if (light) document.body.dataset.light = light; else delete document.body.dataset.light;
    var bgHex = light ? OVERCAST_LIGHT[light] : THEME[theme];
    document.querySelector('meta[name="theme-color"]').setAttribute("content", bgHex);

    $("city-n").textContent = placeName(place);
    $("date").textContent = dateLine(nowLocal);
    $("art").innerHTML = artFor(state, cur.weather_code, isDay);

    var t = r(cur.temperature_2m);
    var tempEl = $("temp");
    tempEl.innerHTML = String(t) + '<span class="deg">°</span>';
    tempEl.classList.toggle("long", String(t).length >= 3);
    $("cond").textContent = condLabel(cur.weather_code, isDay);
    $("sub").textContent = fmt(T.sub, { h: r(Math.max(D.temperature_2m_max[0], cur.temperature_2m)), l: r(Math.min(D.temperature_2m_min[0], cur.temperature_2m)), w: r(cur.wind_speed_10m || 0) });

    var f = r(cur.apparent_temperature), band = bandOf(f);
    $("feels-ic").innerHTML = person(band[1], (cur.wind_speed_10m || 0) >= 30, isRain(cur.weather_code), isSnow(cur.weather_code));
    $("feels-n").innerHTML = f + '<span class="deg">°</span>';
    $("feels-b").textContent = band[2][LANG];
    $("feels-l").textContent = T.feelsL;
    $("feels").style.setProperty("--badge", readableOn(BAND_COLOR[band[1]], bgHex, 1.5));
    playPerson();

    // index of the current hour
    // current hour at the place: from the clock when the data has the offset (keeps cached data honest), else from the data
    var key = cur.time.slice(0, 13);
    if (typeof data.utc_offset_seconds === "number") key = new Date(Date.now() + data.utc_offset_seconds * 1000).toISOString().slice(0, 13);
    var i0 = H.time.findIndex(function (x) { return x.slice(0, 13) === key; });
    if (i0 < 0) i0 = Math.max(0, H.time.findIndex(function (x) { return x.slice(0, 13) === cur.time.slice(0, 13); }));
    var hours = [];
    for (var i = i0; i < Math.min(i0 + 12, H.time.length); i++) hours.push(i);

    var line = $("line"), graph = $("graph");
    if (state === "rain" || state === "rain-night" || state === "snow") {

      var snow = state === "snow";
      var vals = hours.map(function (i) { return snow ? (H.snowfall[i] || 0) : (H.precipitation_probability[i] || 0); });
      var top = snow ? Math.max.apply(null, vals.concat([0.5])) : 100;

      var ticksAt = [0, 2, 4, 6, 8, 11];
      $("ticks").innerHTML = ticksAt.map(function (k) {

        return "<div>" + (k === 0 ? T.now : H.time[hours[k]].slice(11, 13)) + "</div>";

      } else {
        var startK = -1; for (var k2 = 1; k2 < hours.length; k2++) { if (wet(k2)) { startK = k2; break; } }
        title = startK > 0 ? fmt(snow ? T.snowFrom : T.rainFrom, { t: hourText(H.time[hours[startK]]) }) : (snow ? T.snowLight : T.rainLight);
      }
      $("gtitle").textContent = title;
      if (snow) {
        var sum = vals.reduce(function (a, b) { return a + b; }, 0);

    var pTop = 30;
    for (var q = i0; q < i0 + 24 && q < H.time.length; q++) pTop = Math.max(pTop, H.precipitation_probability[q] || 0);
    var hh = "";
    for (var n = 0; n < 24 && i0 + n < H.time.length; n++) {

            icon(H.weather_code[x], H.is_day[x] === 0) + '<div class="hour-v">' + r(H.temperature_2m[x]) + "°</div>" +
            windCell(H.wind_speed_10m && H.wind_speed_10m[x]) +
            '<div class="hour-pb"><div class="hour-bar" style="height:' + Math.max(3, Math.round(pp / pTop * 32)) + 'px"></div></div>' +

    // for the day before sunrise; sunrise if it comes earlier). No sun times in an old cache: night = evening

      icon: '<span class="feels-ic" style="--badge:' + readableOn(BAND_COLOR[band[1]], "#FFFFFF", 1.5) + '">' +

      dateLine: new Intl.DateTimeFormat(LOCALE, { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" }).format(asDate(cur.time)) + " · " + placeName(place),

    paintPages(data);

      (cloud ? " · ☁" + Math.round(cloud.cover) + "%" : "") + (sun ? " · ☀" + Math.round(sun.share * 100) + "%" : "") +
      (light ? " · " + Math.round(cur.shortwave_radiation) + " W/m²" : "") + " · " + BUILD;
  }

  // Today's summary: day condition + high/low, rain in the next 12 h, a big drop later today, strong wind, umbrella, outfit, cold tip
  // b117: the home summary is the pick's editorial (paintPeek); from the weather only the rain (or snow) outlook stays:
  // raining now and when it stops, or rain all day, or when it starts in the next 12 hours, plus the umbrella line
  var homeRain = [];
  function rainText(H, hours) {
    var low1 = function (x) { return LANG === "en" ? x.toLowerCase() : x; }, out = [];
    var wet = function (i) { return (H.precipitation_probability[i] || 0) >= 50; };
    var word = function (i) { return isSnow(H.weather_code[i]) ? T.wSnow : T.wRain; };
    if (hours.length && wet(hours[0])) {
      var end = -1; for (var k = 1; k < hours.length; k++) { if (!wet(hours[k])) { end = hours[k]; break; } }
      out.push(end >= 0 ? fmt(T.sumRainNow, { w: low1(word(hours[0])), t: hourText(H.time[end]) }) : fmt(T.sumRainOn, { w: word(hours[0]) }));
      if (word(hours[0]) === T.wRain) out.push(T.sumUmbrella);
    } else {
      var hit = -1; for (var m = 1; m < hours.length; m++) { if (wet(hours[m])) { hit = hours[m]; break; } }
      if (hit >= 0) {
        out.push(fmt(T.sumRainAt, { w: word(hit), t: hourText(H.time[hit]), p: H.precipitation_probability[hit] }));
        if (word(hit) === T.wRain) out.push(T.sumUmbrella);
      }
    }
    // each line is its own sentence now (en "{w} now, …" came out lowercase after the look text)
    return out.map(function (x) { return x.charAt(0).toUpperCase() + x.slice(1); });
  }


  // ── Place & data ──
  // Berlin carries its geocoding id, so a search for Berlin shows it as saved (b123)
  var BERLIN = { id: 2950159, lat: 52.52, lon: 13.405, gps: false };
  function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  function placeKey(p) { return (+p.lat).toFixed(3) + "," + (+p.lon).toFixed(3); }

  function updateLocButton() {

  }

  function url(p) {
    return "https://api.open-meteo.com/v1/forecast?latitude=" + p.lat + "&longitude=" + p.lon +

      "&hourly=temperature_2m,apparent_temperature,precipitation_probability,snowfall,weather_code,is_day,wind_speed_10m" +

  // The home-screen app keeps running the page it loaded, so new builds never show up on their own.

  var lastBuildCheck = 0;
  function checkBuild() {
    if (Date.now() - lastBuildCheck < 60000) return;
    lastBuildCheck = Date.now();
    fetch(location.pathname + "?build=" + Date.now(), { cache: "no-store" })
      .then(function (res) { return res.ok ? res.text() : ""; })
      .then(function (html) {
        var m = html.match(/var BUILD = "(b\d+)"/);
        if (!m || m[1] === BUILD) return;

        // A new query string so the reload can't come back from the 10-minute HTTP cache of the old page.

  }

  // gen moves on when the place changes, so a reply for the old place is dropped

  // cached data of another place is never shown (data from before b123 has no _place: it is the current place)

    checkBuild();
    if (busy) return; busy = true;
    clearTimeout(retryTimer);
    var g = gen, cached = cachedHere();
    if (cached && !document.getElementById("hours").innerHTML) render(cached, place, true);
    if (!cached) $("status").textContent = T.loading;
    // Forecast (Open-Meteo) and the latest station measurement (Bright Sky / DWD) in parallel;
    // the measurement is optional (outside Germany or when it fails the app runs on the forecast alone)
    var obsReq = fetch("https://api.brightsky.dev/current_weather?lat=" + place.lat + "&lon=" + place.lon, { cache: "no-store" })
      .then(function (res) { return res.ok ? res.json() : null; })
      .catch(function () { return null; });
    // MET Norway (no key; coordinates at most 4 decimals) — a second opinion on the cloud amount
    var metReq = fetch("https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=" + (+place.lat).toFixed(4) + "&lon=" + (+place.lon).toFixed(4))
      .then(function (res) { return res.ok ? res.json() : null; })
      .catch(function () { return null; });
    // DWD weather warnings for this spot via Bright Sky (Germany only; optional)
    var alertReq = fetch("https://api.brightsky.dev/alerts?lat=" + place.lat + "&lon=" + place.lon, { cache: "no-store" })
      .then(function (res) { return res.ok ? res.json() : null; })
      .catch(function () { return null; });

      .then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); })
      .then(function (data) { return alertReq.then(function (a) { if (a && Array.isArray(a.alerts)) data.alerts = { inGermany: !!a.location, list: a.alerts }; return data; }); })
      .then(function (data) { return obsReq.then(function (bs) { if (bs && bs.weather) data.obs = bs.weather; return data; }); })
      .then(function (data) { return metReq.then(function (met) { if (met && met.properties && met.properties.timeseries) data.met = { properties: { timeseries: met.properties.timeseries.slice(0, 4) } }; return data; }); })
      .then(function (data) {

        retries = 0;
        render(data, place, false);
      })
      .catch(function (err) {
        if (g !== gen) return;

        // so try again a few seconds later (up to 3 times) instead of waiting 15 minutes.
        document.documentElement.dataset.lastError = String(err && err.message || err);
        var c = cachedHere();
        if (c) render(c, place, true); else $("status").textContent = T.failed;

      })
      .then(function () { if (g === gen) busy = false; });

  // The whole head (art, temperature, condition, feels-like) opens Today's Look; the city name switches the place
  $("head-tap").addEventListener("click", function (e) { if (!e.target.closest("#city")) openLook(); });
  // Also open on a plain tap (touch released without moving), in case iOS swallows the click.
  // preventDefault stops the follow-up click from landing on the sheet that just opened under the finger.
  (function () {
    var head = $("head-tap"), t0 = null;
    head.addEventListener("touchstart", function (e) {
      var t = e.touches[0]; t0 = e.target.closest("#city") ? null : { x: t.clientX, y: t.clientY, time: Date.now() };
    }, { passive: true });
    head.addEventListener("touchend", function (e) {
      if (!t0) return;
      var t = e.changedTouches[0], moved = Math.abs(t.clientX - t0.x) + Math.abs(t.clientY - t0.y);
      if (moved < 12 && Date.now() - t0.time < 600) { e.preventDefault(); openLook(); }
      t0 = null;
    });
  })();
  $("head-tap").addEventListener("keydown", function (e) { if ((e.key === "Enter" || e.key === " ") && !e.target.closest("#city")) { e.preventDefault(); openLook(); } });
  $("peek").addEventListener("click", openLook);

      h = '<div class="pl-k">' + esc(T.plMine) + "</div>" + plRow({ gps: true }, "g", "", "", gpsNote);
      if (!place.gps && savedAt(place) < 0) h += plRow(place, "c", "c", T.plSave);
      h += myPlaces().map(function (p, i) { return plRow(p, "m" + i, "d" + i, T.plDel); }).join("");
    }
    $("pl-body").innerHTML = h;
  }
  function searchPlaces() {
    var q = $("pl-q").value.trim(), seq = ++plSeq;
    clearTimeout(plTimer);
    if (!q) { plResults = null; paintPlaces(); return; }
    plTimer = setTimeout(function () {
      fetch("https://geocoding-api.open-meteo.com/v1/search?count=8&format=json&language=" + LANG + "&name=" + encodeURIComponent(q))
        .then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); })
        .then(function (d) {
          if (seq !== plSeq) return;
          plResults = (d.results || []).map(function (r) {
            return { id: r.id, name: r.name, lat: +r.latitude.toFixed(4), lon: +r.longitude.toFixed(4),
              sub: [r.admin1, r.country].filter(function (x, i, a) { return x && x !== r.name && a.indexOf(x) === i; }).join(" · ") };
          });
          paintPlaces();
        }, function () { if (seq === plSeq) { plResults = "off"; paintPlaces(); } });
    }, 250);
  }
  function useGps() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function (pos) {
      gpsNote = "";
      setPlace({ lat: +pos.coords.latitude.toFixed(3), lon: +pos.coords.longitude.toFixed(3), gps: true });
      closePlaces();
    }, function () { gpsNote = T.plDenied; paintPlaces(); }, { maximumAge: 600000, timeout: 10000 });
  }
  var placesOpen = false;
  function openPlaces() {
    var s = $("places");
    $("pl-q").value = ""; plResults = null; paintPlaces();
    s.hidden = false; void s.offsetWidth; s.classList.add("open");
    document.body.style.overflow = "hidden";
    document.body.classList.add("look-open");
    placesOpen = true;
    // inside the tap, so iOS brings up the keyboard
    $("pl-q").focus({ preventScroll: true });
  }
  function closePlaces() {
    if (!placesOpen) return;
    placesOpen = false;
    $("pl-q").blur();
    $("places").classList.remove("open");
    document.body.style.overflow = "";
    document.body.classList.remove("look-open");
  }
  $("pl-q").placeholder = T.plFind;
  $("pl-q").addEventListener("input", searchPlaces);
  $("pl-q").addEventListener("keydown", function (e) { if (e.key === "Enter") $("pl-q").blur(); });
  $("pl-grab").addEventListener("click", closePlaces);
  $("pl-body").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var k = b.getAttribute("data-act") || b.getAttribute("data-pick"), c = k.charAt(0), i = +k.slice(1), mine = myPlaces();
    if (b.hasAttribute("data-act")) {
      if (c === "s") mine.push(plResults[i]); else if (c === "c") mine.push(place); else if (c === "d") mine.splice(i, 1);
      store("wx-places", mine); paintPlaces(); return;
    }
    if (c === "g") { useGps(); return; }
    setPlace(c === "r" ? plResults[i] : c === "m" ? mine[i] : place);
    closePlaces();
  });
  // Swipe the sheet down to close it (as Today's Look)
  (function () {
    var sheet = $("places"), y0 = null, dy = 0;
    sheet.addEventListener("touchstart", function (e) { y0 = sheet.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
    sheet.addEventListener("touchmove", function (e) {
      if (y0 === null) return;
      dy = e.touches[0].clientY - y0;
      if (dy > 0) { sheet.classList.add("dragging"); sheet.style.transform = "translateY(" + dy + "px)"; }
    }, { passive: true });
    sheet.addEventListener("touchend", function () {
      if (y0 === null) return;
      sheet.classList.remove("dragging"); sheet.style.transform = "";
      if (dy > 90) closePlaces();
      y0 = null;
    });
  })();
  $("city").addEventListener("click", openPlaces);
  $("city").addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openPlaces(); } });

  updateLocButton();
  refresh();
  setInterval(refresh, 15 * 60 * 1000);
  window.addEventListener("online", function () { retries = 0; refresh(); });
  window.addEventListener("pageshow", function (e) { if (e.persisted) refresh(); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { $("hours").scrollLeft = 0; if (!lookOpen) { lookSeed = String(Math.random()); paintPeek(); } refresh(); } });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weather">
<meta name="theme-color" content="#F2C14E">
<title>Weather</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500;600;700&family=Noto+Sans+KR:wght@500;600;700&display=swap">
<style>
  :root {
    --bg: #F2C14E; --fg: #141414; --graph: #8FB8DE;
    --display: "Anton", "Noto Sans KR", sans-serif;
    --sans: "Poppins", "Noto Sans KR", system-ui, sans-serif;
    --mono: "Poppins", "Noto Sans KR", system-ui, sans-serif; /* data lines: same family as text, set at 500 */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .4s ease, color .4s ease;
  }
  body[data-state="sun"]        { --bg: #F2C14E; --fg: #141414; }
  body[data-state="rain"]       { --bg: #4F5D6B; --fg: #E6ECF2; --graph: #8FB8DE; }
  body[data-state="night"]      { --bg: #1B2140; --fg: #F4F1E8; }
  body[data-state="snow"]       { --bg: #E9EEF3; --fg: #141414; --graph: #5C7A99; }
  body[data-state="overcast"]   { --bg: #DCE1E5; --fg: #141414; }
  body[data-state="night"][data-wx="snow"] { --graph: #BCC8D4; }

  .app {
    max-width: 480px; margin: 0 auto; min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 28px);
  }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .city { font-size: 17px; font-weight: 700; }
  .date { font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .04em; margin-top: 2px; }
  .loc {
    width: 44px; height: 44px; border-radius: 22px; padding: 0;
    border: 1.5px solid var(--fg); background: transparent; color: var(--fg);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .hero-art { display: flex; justify-content: center; margin-top: 28px; height: 170px; }
  .hero-art svg { width: 240px; height: 170px; overflow: hidden; }
  /* Hero art motion (loops) */
  .art-drop { opacity: 0; animation: art-fall .9s linear infinite; }
  @keyframes art-fall { 0% { opacity: 0; transform: translate(3px,-14px); } 15%,85% { opacity: 1; } 100% { opacity: 0; transform: translate(-5px,16px); } }
  .art-sun { transform-origin: 120px 80px; animation: art-glow 2.6s ease-in-out infinite; }
  .art-sun-sm { transform-origin: 168px 54px; }
  @keyframes art-glow { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .art-rays { transform-origin: 120px 80px; animation: art-spin 18s linear infinite; }
  .art-rays line { animation: art-ray 1.6s ease-in-out infinite; }
  .art-rays line:nth-child(even) { animation-delay: .8s; }
  @keyframes art-spin { to { transform: rotate(360deg); } }
  @keyframes art-ray { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .art-bob { animation: art-bob 5s ease-in-out infinite; }
  @keyframes art-bob { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
  .art-drift { animation: art-drift linear infinite; }
  @keyframes art-drift { from { transform: translateX(-90px); } to { transform: translateX(300px); } }
  .art-star { animation: art-tw 2.4s ease-in-out infinite; }
  @keyframes art-tw { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
  .art-flake { opacity: 0; animation: art-snow 3s linear infinite; }
  @keyframes art-snow { 0% { opacity: 0; transform: translate(0,-16px); } 15%,85% { opacity: 1; } 50% { transform: translate(5px,6px); } 100% { opacity: 0; transform: translate(-3px,30px); } }
  @media (prefers-reduced-motion: reduce) { .hero-art svg * { animation: none !important; } .art-drop, .art-flake { opacity: 1; } }
  .temp {
    font-family: var(--display); font-size: 240px; line-height: .86;
    text-align: center; letter-spacing: -4px; margin-top: 8px; white-space: nowrap;
  }
  .temp.long { font-size: 190px; }
  .deg { font-size: .8em; position: relative; top: -.29em; }
  .cond {
    position: relative; text-align: center; font-size: 40px; font-weight: 700;
    line-height: 1.1; letter-spacing: .5px; margin-top: -20px; text-transform: uppercase;
    text-shadow: 3px 0 var(--bg), -3px 0 var(--bg), 0 3px var(--bg), 0 -3px var(--bg),
                 2px 2px var(--bg), -2px -2px var(--bg), 2px -2px var(--bg), -2px 2px var(--bg);
  }
  .sub { text-align: center; font-family: var(--mono); font-weight: 500; font-size: 12px; letter-spacing: .04em; margin-top: 10px; }
  .grow { flex-grow: 1; min-height: 24px; }

  /* Feels-like block: animated person + feels-like temperature + band name */
  .feels {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    margin-top: 14px; padding: 8px 0; border: 0;
    width: 100%; background: none; color: var(--feels, inherit); font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .feels svg { width: 44px; height: 44px; flex: none; overflow: visible; }
  .feels-n { font-family: var(--display); font-size: 56px; line-height: 1; }
  .feels-t { text-align: left; }
  .feels-t span { display: block; }
  .feels-b { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .feels-l { font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .04em; margin-bottom: 2px; }
  .person-ic .fg { fill: currentColor; }
  .person-ic .st { stroke: currentColor; fill: none; stroke-linecap: round; }
  .person-ic .rain { stroke: var(--graph); }
  .person-ic .hd { stroke: var(--bg); stroke-width: 1.6px; paint-order: stroke; }
  .person-ic .fx { opacity: 0; }
  /* animations loop while .play is set (always, after each render) */
  .play.b-freeze .ps { transform-origin: 13px 29px; animation: hunch 2.4s ease-in-out infinite; }
  .play.b-freeze .breath, .play.b-verycold .breath, .play.b-cold .breath { animation: breath 2.4s ease-out infinite; }
  .play.b-verycold .ps { animation: shiver 1.6s linear infinite; }
  .play.b-cold .ps { animation: shiver 2.8s linear infinite; }
  .play.b-chilly .ps { transform-origin: 13px 29px; animation: shrug 2.6s ease-in-out infinite; }
  .play.b-cool .body, .play.b-pleasant .body { transform-origin: 13px 29px; animation: breathe 3.2s ease-in-out infinite; }
  .play.b-pleasant .ps, .play.b-warm .ps { transform-origin: 13px 29px; animation: sway 2.8s ease-in-out infinite; }
  .play.b-hot .drop1, .play.b-scorching .drop1 { animation: drop 2s ease-in infinite; }
  .play.b-scorching .drop2 { animation: drop 2s ease-in .9s infinite; }
  .play.b-scorching .ps { transform-origin: 13px 29px; animation: droop 3s ease-in-out infinite; }
  .play.windy .lean { transform-origin: 13px 29px; animation: lean 2.2s ease-in-out infinite; }
  .play.windy .hair path { transform-origin: 10px 4px; animation: hair 1.1s ease-in-out infinite; }
  .play.wet .rd { animation: rd 1s linear infinite; }
  .play.wet .rd:nth-child(2) { animation-delay: .35s; } .play.wet .rd:nth-child(3) { animation-delay: .7s; }
  .play.snowy .fl { animation: fl 2.6s linear infinite; }
  .play.snowy .fl:nth-child(2) { animation-delay: .9s; } .play.snowy .fl:nth-child(3) { animation-delay: 1.7s; }
  @keyframes hunch { 0%,100% { transform: scale(1); } 40%,70% { transform: scale(1.04, .93); } }
  @keyframes breath { 0%,35% { opacity: 0; transform: scale(.6); } 50% { opacity: .9; } 80%,100% { opacity: 0; transform: translate(4px,-3px) scale(1.2); } }
  @keyframes shiver { 0%,4%,8%,12%,16%,20%,24%,28% { transform: translateX(-.7px); } 2%,6%,10%,14%,18%,22%,26% { transform: translateX(.7px); } 30%,100% { transform: none; } }
  @keyframes shrug { 0%,100% { transform: none; } 30%,55% { transform: scale(.95, .96) translateY(.6px); } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04, 1.06); } }
  @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes drop { 0%,20% { opacity: 0; transform: translateY(0); } 30% { opacity: 1; } 80% { opacity: 1; transform: translateY(9px); } 100% { opacity: 0; transform: translateY(11px); } }
  @keyframes droop { 0%,100% { transform: none; } 50% { transform: scale(1.03, .95); } }
  @keyframes lean { 0%,100% { transform: rotate(2deg); } 50% { transform: rotate(5deg); } }
  @keyframes hair { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-14deg) translateX(-1px); } }
  @keyframes rd { from { opacity: 1; transform: translate(0,-4px); } to { opacity: 0; transform: translate(-2px,6px); } }
  @keyframes fl { from { opacity: 0; transform: translateY(-6px); } 20% { opacity: 1; } to { opacity: 0; transform: translateY(10px); } }
  @media (prefers-reduced-motion: reduce) { .person-ic * { animation: none !important; } }

  .line { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; padding: 14px 0; }
  .line svg { flex: none; }
  .graph { padding: 14px 0 12px; display: flex; flex-direction: column; gap: 10px; }
  .graph-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .graph-title { font-size: 14px; font-weight: 700; }
  .graph-max { font-family: var(--mono); font-weight: 500; font-size: 12px; white-space: nowrap; }
  .bars { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; align-items: end; height: 48px; }
  .bars div { background: var(--graph); min-height: 4px; }
  .ticks { display: flex; justify-content: space-between; font-family: var(--mono); font-weight: 500; font-size: 10px; }

  .hours-wrap { border-top: 1.5px solid var(--fg); }
  .hours {
    display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
    margin: 0 -24px; padding: 14px 24px;
  }
  .hours::-webkit-scrollbar { display: none; }
  .hour { flex: none; width: 48px; padding: 8px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .hour.now .hour-v { position: relative; }
  .hour.now .hour-v::after {
    content: ""; position: absolute; left: 50%; bottom: -4px;
    width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: currentColor;
  }
  .hour-t { font-family: var(--mono); font-weight: 500; font-size: 11px; line-height: 14px; }
  .hour-v { font-family: var(--display); font-size: 22px; }
  .hour-p { font-family: var(--mono); font-weight: 500; font-size: 10px; min-height: 12px; }
  .days {
    border-top: 1.5px solid var(--fg); padding-top: 14px;
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; text-align: center;
  }
  .day { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .day-name { font-family: var(--mono); font-weight: 500; font-size: 11px; }
  .day-temp { font-family: var(--display); font-size: 22px; }
  .status { font-family: var(--mono); font-weight: 500; font-size: 10px; text-align: center; margin-top: 12px; opacity: .8; min-height: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body data-state="sun">
<main class="app">
  <div class="top">
    <div>
      <div class="city" id="city">Berlin</div>
      <div class="date" id="date">&nbsp;</div>
    </div>
    <button class="loc" id="loc" type="button" aria-label="Use my location">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="hero-art" id="art" aria-hidden="true"></div>
  <div class="temp" id="temp">–</div>
  <div class="cond" id="cond">&nbsp;</div>
  <div class="sub" id="sub">&nbsp;</div>
  <button class="feels" id="feels" type="button">
    <span id="feels-ic"></span>
    <span class="feels-n" id="feels-n"></span>
    <span class="feels-t"><span class="feels-l" id="feels-l"></span><span class="feels-b" id="feels-b"></span></span>
  </button>

  <div class="grow"></div>

  <div class="line" id="line" hidden></div>
  <div class="graph" id="graph" hidden>
    <div class="graph-head"><div class="graph-title" id="gtitle"></div><div class="graph-max" id="gmax"></div></div>
    <div class="bars" id="bars"></div>
    <div class="ticks" id="ticks"></div>
  </div>

  <div class="hours-wrap"><div class="hours" id="hours"></div></div>
  <div class="days" id="days"></div>
  <div class="status" id="status"></div>
</main>

<script>
(function () {
  "use strict";

  var nav = (navigator.language || "en").toLowerCase();

  var T = {
    en: {
      berlin: "Berlin", here: "Current location", useLoc: "Use my location", useBerlin: "Show Berlin",

      rainFrom: "Ab {t} Regen", rainUntil: "Regen lässt gegen {t} nach", rainOn: "Regen in den nächsten 12 Std.", rainLight: "Geringe Regenwahrscheinlichkeit",
      snowFrom: "Ab {t} Schnee", snowUntil: "Schnee lässt gegen {t} nach", snowOn: "Schnee in den nächsten 12 Std.", snowLight: "Leichter Schneefall möglich",
      max: "Bis {p} %", total: "Etwa {c} cm", now: "Jetzt",

      noRain: "12시간 동안 비 소식 없음", rainAt: "{t}쯤 비 · {p}%",
      tomorrow: "내일 {t} {v}° · {c}",

      max: "최대 {p}%", total: "약 {c}cm", now: "지금",

    }
  }[LANG];

  var COND = {
    clear:      { en: "Clear", de: "Klar", ko: "맑음" },
    clearNight: { en: "Clear night", de: "Klare Nacht", ko: "맑은 밤" },
    mainly:     { en: "Mostly clear", de: "Überwiegend klar", ko: "대체로 맑음" },
    partly:     { en: "Partly cloudy", de: "Leicht bewölkt", ko: "구름 조금" },
    overcast:   { en: "Overcast", de: "Bedeckt", ko: "흐림" },
    fog:        { en: "Fog", de: "Nebel", ko: "안개" },
    drizzle:    { en: "Drizzle", de: "Nieselregen", ko: "이슬비" },
    rain:       { en: "Rain", de: "Regen", ko: "비" },
    heavyRain:  { en: "Heavy rain", de: "Starkregen", ko: "강한 비" },
    freezing:   { en: "Freezing rain", de: "Gefrierender Regen", ko: "어는 비" },
    showers:    { en: "Showers", de: "Schauer", ko: "소나기" },
    snow:       { en: "Snow", de: "Schnee", ko: "눈" },
    heavySnow:  { en: "Heavy snow", de: "Starker Schneefall", ko: "함박눈" },
    thunder:    { en: "Thunderstorm", de: "Gewitter", ko: "뇌우" }
  };

  // Feels-like bands (apparent temperature, °C): upper bound, key, names
  var BANDS = [
    [-10, "freeze", { en: "Bitter cold", de: "Eisig", ko: "혹한" }],
    [-3, "verycold", { en: "Very cold", de: "Sehr kalt", ko: "매우 추움" }],
    [4, "cold", { en: "Cold", de: "Kalt", ko: "추움" }],
    [11, "chilly", { en: "Chilly", de: "Frisch", ko: "쌀쌀" }],
    [16, "cool", { en: "Cool", de: "Kühl", ko: "선선" }],
    [22, "pleasant", { en: "Pleasant", de: "Angenehm", ko: "쾌적" }],
    [27, "warm", { en: "Warm", de: "Warm", ko: "따뜻" }],
    [32, "hot", { en: "Hot", de: "Heiß", ko: "더움" }],
    [Infinity, "scorching", { en: "Scorching", de: "Sehr heiß", ko: "폭염" }]
  ];
  // Band colors from the spectrum. Used as-is unless too close to the screen background (<3:1);
  // then just that case gets deeper (light screens) or lighter (dark screens) and more saturated until it reads.
  var BAND_COLOR = { freeze: "#1E2A5A", verycold: "#2F4A86", cold: "#5C7FB8", chilly: "#9DB7D4", cool: "#C9D6C2",
                     pleasant: "#FFFFFF", warm: "#F2C14E", hot: "#E8862C", scorching: "#C4401A" };
  function hexRgb(h) { return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16) / 255; }); }
  function luminance(h) {
    var c = hexRgb(h).map(function (v) { return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function contrast(a, b) { var x = luminance(a), y = luminance(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  function rgbHsl(c) {
    var r = c[0], g = c[1], b = c[2], mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, h = 0, s = 0, d = mx - mn;
    if (d) {

  function fmt(s, o) { return s.replace(/\{(\w)\}/g, function (_, k) { return o[k]; }); }

  // ── Weather codes ──
  function isSnow(c) { return (c >= 71 && c <= 77) || c === 85 || c === 86; }
  function isRain(c) { return (c >= 51 && c <= 67) || (c >= 80 && c <= 82) || c >= 95; }
  function isOvercast(c) { return c === 3 || c === 45 || c === 48; }
  function condKey(c, isDay) {
    if (c === 0) return isDay ? "clear" : "clearNight";
    if (c === 1) return isDay ? "mainly" : "clearNight";
    if (c === 2) return "partly";
    if (c === 3) return "overcast";
    if (c === 45 || c === 48) return "fog";
    if (c >= 51 && c <= 55) return "drizzle";
    if (c === 56 || c === 57 || c === 66 || c === 67) return "freezing";
    if (c === 61 || c === 63) return "rain";
    if (c === 65) return "heavyRain";
    if (c === 71 || c === 73 || c === 77) return "snow";
    if (c === 75 || c === 86) return "heavySnow";
    if (c === 85) return "snow";
    if (c >= 80 && c <= 82) return "showers";
    if (c >= 95) return "thunder";
    return "partly";
  }
  function condLabel(c, isDay) { return COND[condKey(c, isDay)][LANG]; }
  function stateOf(c, isDay) {
    if (isSnow(c)) return "snow";
    if (isRain(c)) return isDay ? "rain" : "rain-night";
    if (isOvercast(c) && isDay) return "overcast";
    return isDay ? "sun" : "night";
  }
  var THEME = { sun: "#F2C14E", rain: "#4F5D6B", night: "#1B2140", snow: "#E9EEF3", overcast: "#DCE1E5" };

  // ── Hero art (shapes from the design files), animated with the .art-* classes ──
  // Day: code 0 sun only · 1 sun + one tiny drifting cloud · 2 sun behind a cloud · 3/45/48 overcast with drifting clouds.
  // Night: 0–1 moon and stars · 2+ moon behind a cloud. Rain and snow keep falling under their clouds.
  var CLOUD = "M36 122h120a30 30 0 0 0 0-60 44 44 0 0 0-84 10 26 26 0 0 0-36 50z";
  var RAYS = '<g class="art-rays" stroke="#E8621C" stroke-width="6" stroke-linecap="round">' +
    '<line x1="120" y1="2" x2="120" y2="12"/><line x1="120" y1="148" x2="120" y2="158"/><line x1="42" y1="80" x2="52" y2="80"/><line x1="188" y1="80" x2="198" y2="80"/>' +
    '<line x1="65" y1="25" x2="72" y2="32"/><line x1="168" y1="128" x2="175" y2="135"/><line x1="65" y1="135" x2="72" y2="128"/><line x1="168" y1="32" x2="175" y2="25"/></g>' +
    '<circle class="art-sun" cx="120" cy="80" r="60" fill="#E8621C"/>';
  function drops(list) {
    return '<g stroke="#8FB8DE" stroke-width="3" stroke-linecap="round">' + list.map(function (d) {
      return '<path class="art-drop" style="animation-delay:' + d[2] + 's" d="M' + d[0] + " " + d[1] + 'l-6 16"/>';
    }).join("") + "</g>";
  }
  function drift(y, scale, fill, dur, delay) {
    return '<g class="art-drift" style="animation-duration:' + dur + "s;animation-delay:" + delay + 's"><path transform="translate(0 ' + y + ") scale(" + scale + ')" d="' + CLOUD + '" fill="' + fill + '"/></g>';
  }
  var MOON_SMALL = '<circle cx="170" cy="50" r="30" fill="#D9D2B8"/><circle cx="184" cy="40" r="26" fill="#1B2140"/>';
  var ART = {
    sunClear: '<svg viewBox="0 0 240 170">' + RAYS + "</svg>",
    sunMostly: '<svg viewBox="0 0 240 170">' + RAYS +
      '<g class="art-drift" style="animation-duration:20s;animation-delay:-8s"><path transform="translate(0 112) scale(.34)" d="M44 150h122a30 30 0 0 0 0-60 44 44 0 0 0-84 10 28 28 0 0 0-38 50z" fill="#FFF4D6"/></g></svg>',
    sunCloudy: '<svg viewBox="0 0 240 170"><circle class="art-sun art-sun-sm" cx="168" cy="54" r="40" fill="#E8621C"/>' +
      '<path class="art-bob" d="M30 150h150a34 34 0 0 0 0-68 50 50 0 0 0-96 12 30 30 0 0 0-54 56z" fill="#FFF4D6"/></svg>',
    night: '<svg viewBox="0 0 240 170"><circle cx="124" cy="88" r="62" fill="#F4E9C8"/><circle cx="152" cy="68" r="54" fill="#1B2140"/><g fill="#F4E9C8">' +
      '<circle class="art-star" cx="40" cy="40" r="3"/><circle class="art-star" style="animation-delay:.8s" cx="206" cy="132" r="2.5"/>' +
      '<circle class="art-star" style="animation-delay:1.6s" cx="198" cy="26" r="2"/><circle class="art-star" style="animation-delay:.4s" cx="30" cy="140" r="2"/>' +
      '<circle class="art-star" style="animation-delay:1.2s" cx="72" cy="12" r="1.8"/></g></svg>',
    nightCloudy: '<svg viewBox="0 0 240 170">' + MOON_SMALL + '<circle class="art-star" cx="40" cy="30" r="2.5" fill="#F4E9C8"/>' +
      '<path class="art-bob" d="M36 142h120a30 30 0 0 0 0-60 44 44 0 0 0-84 10 26 26 0 0 0-36 50z" fill="#4A5666"/></svg>',
    rain: '<svg viewBox="0 0 240 170"><path d="M96 96h104a28 28 0 0 0 0-56 42 42 0 0 0-80 8 26 26 0 0 0-24 48z" fill="#7A8896"/>' +
      drops([[62, 134, 0], [80, 140, .45], [98, 134, .2], [116, 140, .65], [134, 134, .35], [170, 110, .1], [188, 108, .55]]) +
      '<path d="' + CLOUD + '" fill="#2F3842"/></svg>',
    rainNight: '<svg viewBox="0 0 240 170">' + MOON_SMALL +
      drops([[62, 134, 0], [80, 140, .45], [98, 134, .2], [116, 140, .65], [134, 134, .35]]) +
      '<path d="' + CLOUD + '" fill="#4A5666"/></svg>',
    overcast: '<svg viewBox="0 0 240 170">' + drift(6, .32, "#B9C1C9", 22, -6) +
      '<g transform="translate(0 20)"><path d="M96 96h104a28 28 0 0 0 0-56 42 42 0 0 0-80 8 26 26 0 0 0-24 48z" fill="#958E81"/><path d="' + CLOUD + '" fill="#EDE8DF"/></g>' +
      drift(112, .38, "#FFFFFF", 14, 0) + drift(-4, .26, "#FFFFFF", 18, -11) + "</svg>"
  };
  function snowArt(flake) {
    var f = [[64, 132, 5, 0], [100, 134, 5, 1.2], [136, 130, 5, .5], [172, 132, 5, 1.8], [82, 130, 3.5, 2.4], [154, 134, 3.5, .9], [118, 128, 2.5, 1.5]];
    return '<svg viewBox="0 0 240 170"><g fill="' + flake + '">' + f.map(function (d) {
      return '<circle class="art-flake" style="animation-delay:' + d[3] + 's" cx="' + d[0] + '" cy="' + d[1] + '" r="' + d[2] + '"/>';
    }).join("") + '</g><path d="M44 112h132a30 30 0 0 0 0-60 46 46 0 0 0-88 10 26 26 0 0 0-44 50z" fill="#BCC8D4"/></svg>';
  }
  function artFor(state, c, isDay) {
    if (state === "snow") return snowArt(isDay ? "#5C7A99" : "#E6ECF2");
    if (state === "overcast") return ART.overcast;
    if (state === "rain") return ART.rain;
    if (state === "rain-night") return ART.rainNight;
    if (state === "night") return c >= 2 ? ART.nightCloudy : ART.night;
    return c === 0 ? ART.sunClear : c === 1 ? ART.sunMostly : ART.sunCloudy;
  }

  // ── Small icons (forecast row, one-line summary) ──
  function icon(c, night) {
    var f = 'fill="currentColor"';
    if (isSnow(c)) return '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 11h9a3 3 0 0 0 0-6 4 4 0 0 0-7.6 1A2.5 2.5 0 0 0 4 11z" ' + f + '/><circle cx="5.5" cy="14.5" r="1.4" ' + f + '/><circle cx="9.5" cy="15.5" r="1.4" ' + f + '/><circle cx="13.5" cy="14.5" r="1.4" ' + f + '/></svg>';
    if (isRain(c)) return '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 11h9a3 3 0 0 0 0-6 4 4 0 0 0-7.6 1A2.5 2.5 0 0 0 4 11z" ' + f + '/><path d="M6 13.5l-1 2.5M10 13.5l-1 2.5M14 13.5l-1 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
    if (c >= 2) return '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 15h9a3.5 3.5 0 0 0 0-7 4.5 4.5 0 0 0-8.6 1.2A3 3 0 0 0 4 15z" ' + f + '/></svg>';
    if (night) return '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11.5 2.5a6.5 6.5 0 1 0 4 11.6A7 7 0 0 1 11.5 2.5z" ' + f + '/></svg>';
    return '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6" ' + f + '/></svg>';
  }
  function person(band, windy, rain, snow) {
    var cls = "person-ic b-" + band + (windy ? " windy" : "") + (rain ? " wet" : "") + (snow ? " snowy" : "");
    var back = "", over = "", front = "";
    if (snow) back = '<g class="fg"><circle class="fl fx" cx="3" cy="3" r="1.3"/><circle class="fl fx" cx="24" cy="1.5" r="1.1"/><circle class="fl fx" cx="27" cy="6" r="1.3"/></g>';
    if (rain) back = '<g class="st rain" stroke-width="1.4"><path class="rd fx" d="M4 1l-1 3"/><path class="rd fx" d="M24 0l-1 3"/><path class="rd fx" d="M28 5l-1 3"/></g>';
    if (windy) over = '<g class="hair st" stroke-width="1.5"><path d="M9 3.2c-2-1.2-4.5-1.2-6.5 0"/><path d="M8 5.2c-2.2-.8-4.6-.6-6.5.6"/><path d="M7.2 7.4c-2-.4-4 0-5.6 1"/></g>';
    if (band === "freeze" || band === "verycold" || band === "cold") front = '<circle class="breath fg fx" cx="24.5" cy="8" r="2.4"/>';
    if (band === "hot" || band === "scorching") front = '<path class="drop1 fg fx" d="M22.8 6c1.2 1.6 1.9 2.7 1.9 3.6a1.9 1.9 0 0 1-3.8 0c0-.9.7-2 1.9-3.6z"/>';
    if (band === "scorching") front += '<path class="drop2 fg fx" d="M3.2 8c1 1.3 1.6 2.2 1.6 3a1.6 1.6 0 0 1-3.2 0c0-.8.6-1.7 1.6-3z"/>';
    return '<svg class="' + cls + '" viewBox="0 0 30 30" aria-hidden="true">' + back +
      '<g class="lean"><g class="ps"><path class="fg body" d="M1.5 25.5c0-7 5-10.5 11.5-10.5s11.5 3.5 11.5 10.5c0 2.3-5.2 3.4-11.5 3.4S1.5 27.8 1.5 25.5z"/>' +
      '<circle class="fg hd" cx="13" cy="9" r="7"/>' + over + "</g></g>" + front + "</svg>";
  }
  var UMBRELLA = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 9a7 7 0 0 1 14 0z" fill="currentColor"/><path d="M9 9v5a2 2 0 0 1-4 0" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>';

  // ── Time formatting (data times are local to the place, "YYYY-MM-DDTHH:MM") ──
  function parts(s) { return { y: +s.slice(0, 4), mo: +s.slice(5, 7), d: +s.slice(8, 10), h: +s.slice(11, 13), mi: +s.slice(14, 16) }; }
  function asDate(s) { var p = parts(s); return new Date(Date.UTC(p.y, p.mo - 1, p.d, p.h || 12, p.mi || 0)); }
  function hourText(s) {
    var h = parts(s).h;
    if (LANG === "ko") return h + "시";
    if (LANG === "de") return h + " Uhr";
    var ap = h < 12 ? "am" : "pm"; var hh = h % 12 || 12; return hh + " " + ap;
  }
  function dateLine(s) {
    var d = asDate(s);
    var day = new Intl.DateTimeFormat(LOCALE, { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" }).format(d);
    return day + " · " + s.slice(11, 16);
  }
  function weekday(s) {
    return new Intl.DateTimeFormat(LOCALE, { weekday: "short", timeZone: "UTC" }).format(asDate(s)).replace(".", "");
  }
  function r(n) { var v = Math.round(n); return v === 0 ? 0 : v; }

  // ── Render ──
  var $ = function (id) { return document.getElementById(id); };

  // The person's motion loops forever; a tap restarts it from the beginning
  function playPerson() {
    var ic = document.querySelector("#feels-ic svg");
    if (!ic) return;
    ic.classList.remove("play"); void ic.offsetWidth; ic.classList.add("play");
  }

  function render(data, place, stale) {
    var cur = data.current, H = data.hourly, D = data.daily;
    var isDay = cur.is_day === 1;
    var state = stateOf(cur.weather_code, isDay);
    // Colors: by weather during the day, one dark night color for every night (art and graphs still follow the weather)
    var theme = isDay ? state : "night";
    document.body.dataset.state = theme;
    document.body.dataset.wx = state;
    document.querySelector('meta[name="theme-color"]').setAttribute("content", THEME[theme]);

    $("city").textContent = place.gps ? T.here : T.berlin;
    $("date").textContent = dateLine(cur.time);
    $("art").innerHTML = artFor(state, cur.weather_code, isDay);

    var t = r(cur.temperature_2m);
    var tempEl = $("temp");
    tempEl.innerHTML = String(t) + '<span class="deg">°</span>';
    tempEl.classList.toggle("long", String(t).length >= 3);
    $("cond").textContent = condLabel(cur.weather_code, isDay);
    $("sub").textContent = fmt(T.sub, { h: r(D.temperature_2m_max[0]), l: r(D.temperature_2m_min[0]), w: r(cur.wind_speed_10m || 0) });

    var f = r(cur.apparent_temperature), band = bandOf(f);
    $("feels-ic").innerHTML = person(band[1], (cur.wind_speed_10m || 0) >= 30, isRain(cur.weather_code), isSnow(cur.weather_code));
    $("feels-n").innerHTML = f + '<span class="deg">°</span>';
    $("feels-b").textContent = band[2][LANG];
    $("feels-l").textContent = T.feelsL;
    // "Pleasant" is always plain white (user's choice), even on light screens
    $("feels").style.setProperty("--feels", band[1] === "pleasant" ? BAND_COLOR.pleasant : readableOn(BAND_COLOR[band[1]], THEME[theme]));
    playPerson();

    // index of the current hour
    // current hour at the place: from the clock when the data has the offset (keeps cached data honest), else from the data
    var key = cur.time.slice(0, 13);
    if (typeof data.utc_offset_seconds === "number") key = new Date(Date.now() + data.utc_offset_seconds * 1000).toISOString().slice(0, 13);
    var i0 = H.time.findIndex(function (x) { return x.slice(0, 13) === key; });
    if (i0 < 0) i0 = Math.max(0, H.time.findIndex(function (x) { return x.slice(0, 13) === cur.time.slice(0, 13); }));
    var hours = [];
    for (var i = i0; i < Math.min(i0 + 12, H.time.length); i++) hours.push(i);

    var line = $("line"), graph = $("graph");
    if (state === "rain" || state === "rain-night" || state === "snow") {
      line.hidden = true; graph.hidden = false;
      var snow = state === "snow";
      var vals = hours.map(function (i) { return snow ? (H.snowfall[i] || 0) : (H.precipitation_probability[i] || 0); });
      var top = snow ? Math.max.apply(null, vals.concat([0.5])) : 100;
      $("bars").innerHTML = vals.map(function (v) { return '<div style="height:' + Math.max(4, Math.round(v / top * 48)) + 'px"></div>'; }).join("");
      var ticksAt = [0, 2, 4, 6, 8, 11];
      $("ticks").innerHTML = ticksAt.map(function (k) {
        if (k >= hours.length) return "<div></div>";
        return "<div>" + (k === 0 ? T.now : H.time[hours[k]].slice(11, 13)) + "</div>";
      }).join("");

      var wet = function (k) { var i = hours[k]; return snow ? (H.snowfall[i] || 0) >= 0.1 : (H.precipitation_probability[i] || 0) >= 50; };
      var title;
      if (wet(0)) {
        var endK = -1; for (var k = 1; k < hours.length; k++) { if (!wet(k)) { endK = k; break; } }
        title = endK > 0 ? fmt(snow ? T.snowUntil : T.rainUntil, { t: hourText(H.time[hours[endK]]) }) : (snow ? T.snowOn : T.rainOn);
      } else {
        var startK = -1; for (var k2 = 1; k2 < hours.length; k2++) { if (wet(k2)) { startK = k2; break; } }
        title = startK > 0 ? fmt(snow ? T.snowFrom : T.rainFrom, { t: hourText(H.time[hours[startK]]) }) : (snow ? T.snowLight : T.rainLight);
      }
      $("gtitle").textContent = title;
      if (snow) {
        var sum = vals.reduce(function (a, b) { return a + b; }, 0);
        $("gmax").textContent = fmt(T.total, { c: sum < 1 ? sum.toFixed(1).replace(".", LANG === "de" ? "," : ".") : Math.round(sum) });
      } else {
        $("gmax").textContent = fmt(T.max, { p: Math.max.apply(null, vals) });
      }
    } else {
      graph.hidden = true; line.hidden = false;
      var text;
      if (state === "night") {
        var morning = -1;
        for (var j = i0 + 1; j < H.time.length; j++) { if (parts(H.time[j]).h === 8) { morning = j; break; } }
        text = morning >= 0 ? fmt(T.tomorrow, { t: hourText(H.time[morning]), v: r(H.temperature_2m[morning]), c: condLabel(H.weather_code[morning], 1) }) : T.noRain;
        line.innerHTML = icon(morning >= 0 ? H.weather_code[morning] : 0) + "<span></span>";
      } else {
        var hit = -1;
        for (var m = 0; m < hours.length; m++) { if ((H.precipitation_probability[hours[m]] || 0) >= 50) { hit = hours[m]; break; } }
        text = hit >= 0 ? fmt(T.rainAt, { t: hourText(H.time[hit]), p: H.precipitation_probability[hit] }) : T.noRain;
        line.innerHTML = UMBRELLA + "<span></span>";
      }
      line.querySelector("span").textContent = text;
    }

    var hh = "";
    for (var n = 0; n < 24 && i0 + n < H.time.length; n++) {
      var x = i0 + n, pp = H.precipitation_probability[x] || 0;
      hh += '<div class="hour' + (n === 0 ? " now" : "") + '"><div class="hour-t">' + (n === 0 ? T.now : H.time[x].slice(11, 13)) + "</div>" +
            icon(H.weather_code[x], H.is_day[x] === 0) + '<div class="hour-v">' + r(H.temperature_2m[x]) + "°</div>" +
            '<div class="hour-p">' + (pp >= 20 ? pp + "%" : "") + "</div></div>";
    }
    $("hours").innerHTML = hh;
    $("hours").scrollLeft = 0;

    var html = "";
    for (var d = 1; d <= 6 && d < D.time.length; d++) {
      html += '<div class="day"><div class="day-name">' + weekday(D.time[d]) + "</div>" + icon(D.weather_code[d]) +
              '<div class="day-temp">' + r(D.temperature_2m_max[d]) + "</div></div>";
    }
    $("days").innerHTML = html;

    var when = new Date(data._fetched).toTimeString().slice(0, 5);
    $("status").textContent = fmt(stale ? T.offline : T.updated, { t: when });
  }

  // ── Place & data ──
  var BERLIN = { lat: 52.52, lon: 13.405, gps: false };
  function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }

  var place = load("wx-place") || BERLIN;

  function updateLocButton() {
    $("loc").setAttribute("aria-label", place.gps ? T.useBerlin : T.useLoc);
  }

  function url(p) {
    return "https://api.open-meteo.com/v1/forecast?latitude=" + p.lat + "&longitude=" + p.lon +
      "&current=temperature_2m,apparent_temperature,weather_code,is_day,wind_speed_10m" +
      "&hourly=temperature_2m,precipitation_probability,snowfall,weather_code,is_day" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&timezone=auto&forecast_days=8";
  }

  var busy = false;
  function refresh() {
    if (busy) return; busy = true;
    var cached = load("wx-data");
    if (cached && !document.getElementById("days").innerHTML) render(cached, place, true);
    if (!cached) $("status").textContent = T.loading;
    fetch(url(place), { cache: "no-store" })
      .then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); })
      .then(function (data) {
        if (!data.current) throw new Error("bad data");
        data._fetched = Date.now();
        store("wx-data", data);
        render(data, place, false);
      })
      .catch(function () {
        var c = load("wx-data");
        if (c) render(c, place, true); else $("status").textContent = T.failed;
      })
      .then(function () { busy = false; });
  }

  $("feels").addEventListener("click", playPerson);

  $("loc").addEventListener("click", function () {
    if (place.gps) {
      place = BERLIN; store("wx-place", place); updateLocButton(); refresh(); return;
    }
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function (pos) {
      place = { lat: +pos.coords.latitude.toFixed(3), lon: +pos.coords.longitude.toFixed(3), gps: true };
      store("wx-place", place); updateLocButton(); refresh();
    }, function () {}, { maximumAge: 600000, timeout: 10000 });
  });

  updateLocButton();
  refresh();
  setInterval(refresh, 15 * 60 * 1000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { $("hours").scrollLeft = 0; refresh(); } });
})();
</script>
</body>
</html>

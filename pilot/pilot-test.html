<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global Climate Pilot (isolated)</title><style>body{font:16px system-ui;max-width:780px;margin:3rem auto;padding:0 1rem}li{padding:.5rem 0}.pass{color:green}.fail{color:crimson}</style></head><body><h1>Global Climate Pilot</h1><p>Isolated fixture test. No live weather API, geolocation, or production selection changes.</p><ol id="results"></ol><script src="../look/outfits.js"></script><script src="global-climate-pilot.js"></script><script>const results=window.WX_GLOBAL_CLIMATE_PILOT.run(window.WX_LOOKS.outfits);document.getElementById('results').innerHTML=results.map(x=>'<li class="'+(x.passed?'pass':'fail')+'">'+(x.passed?'PASS':'FAIL')+' - '+x.scenario+' (IDs: '+(x.matchedIds.join(', ')||'none')+')</li>').join('');</script></body></html>

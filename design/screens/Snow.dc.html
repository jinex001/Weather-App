<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weather — Snow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#141414}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 24px 28px; background: #E9EEF3; color: #141414; display: flex; flex-direction: column; font-family: 'Noto Sans KR', sans-serif">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 17px; font-weight: 700">{{t.city}}</div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.04em">{{t.date}}</div>
    </div>
    <button aria-label="{{t.change}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #141414; background: transparent; color: #141414; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div style="display: flex; justify-content: center; margin-top: 28px">
    <svg width="240" height="170" viewBox="0 0 240 170" aria-hidden="true">
      <path d="M44 112h132a30 30 0 0 0 0-60 46 46 0 0 0-88 10 26 26 0 0 0-44 50z" fill="#BCC8D4"/>
      <circle cx="64" cy="132" r="5" fill="#5C7A99"/>
      <circle cx="100" cy="150" r="5" fill="#5C7A99"/>
      <circle cx="136" cy="130" r="5" fill="#5C7A99"/>
      <circle cx="172" cy="148" r="5" fill="#5C7A99"/>
      <circle cx="82" cy="162" r="3.5" fill="#5C7A99"/>
      <circle cx="154" cy="164" r="3.5" fill="#5C7A99"/>
      <circle cx="118" cy="168" r="2.5" fill="#5C7A99"/>
    </svg>
  </div>

  <div style="font-family: 'Anton', sans-serif; font-size: 240px; line-height: 0.86; text-align: center; letter-spacing: -4px; margin-top: 8px">-2<span style="position: relative; top: -0.29em; font-size: 0.8em">°</span></div>
  <div style="position: relative; text-align: center; font-size: 40px; font-weight: 700; margin-top: -20px; line-height: 1.1; letter-spacing: -0.5px; text-shadow: 3px 0 #E9EEF3, -3px 0 #E9EEF3, 0 3px #E9EEF3, 0 -3px #E9EEF3, 2px 2px #E9EEF3, -2px -2px #E9EEF3, 2px -2px #E9EEF3, -2px 2px #E9EEF3">{{t.cond}}</div>
  <div style="text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; margin-top: 6px; letter-spacing: 0.04em">{{t.feels}}</div>

  <div style="flex-grow: 1"></div>

  <div style="border-top: 1.5px solid #141414; padding: 14px 0 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 14px; font-weight: 700">{{t.snowFrom}}</div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px">{{t.total}}</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; align-items: end; height: 48px">
      <div style="height: 4px; background: #5C7A99"></div>
      <div style="height: 4px; background: #5C7A99"></div>
      <div style="height: 12px; background: #5C7A99"></div>
      <div style="height: 26px; background: #5C7A99"></div>
      <div style="height: 40px; background: #5C7A99"></div>
      <div style="height: 48px; background: #5C7A99"></div>
      <div style="height: 46px; background: #5C7A99"></div>
      <div style="height: 38px; background: #5C7A99"></div>
      <div style="height: 28px; background: #5C7A99"></div>
      <div style="height: 16px; background: #5C7A99"></div>
      <div style="height: 8px; background: #5C7A99"></div>
      <div style="height: 4px; background: #5C7A99"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px">
      <div>{{t.now}}</div><div>14</div><div>16</div><div>18</div><div>20</div><div>23</div>
    </div>
  </div>

  <div style="border-top: 1.5px solid #141414; padding-top: 14px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; text-align: center">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px">{{t.tue}}</div><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 11h9a3 3 0 0 0 0-6 4 4 0 0 0-7.6 1A2.5 2.5 0 0 0 4 11z" fill="#141414"/><circle cx="5.5" cy="14.5" r="1.4" fill="#141414"/><circle cx="9.5" cy="15.5" r="1.4" fill="#141414"/><circle cx="13.5" cy="14.5" r="1.4" fill="#141414"/></svg><div style="font-family: 'Anton', sans-serif; font-size: 22px">-1</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px">{{t.wed}}</div><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 15h9a3.5 3.5 0 0 0 0-7 4.5 4.5 0 0 0-8.6 1.2A3 3 0 0 0 4 15z" fill="#141414"/></svg><div style="font-family: 'Anton', sans-serif; font-size: 22px">0</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px">{{t.thu}}</div><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="#141414"/></svg><div style="font-family: 'Anton', sans-serif; font-size: 22px">2</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px">{{t.fri}}</div><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 11h9a3 3 0 0 0 0-6 4 4 0 0 0-7.6 1A2.5 2.5 0 0 0 4 11z" fill="#141414"/><circle cx="5.5" cy="14.5" r="1.4" fill="#141414"/><circle cx="9.5" cy="15.5" r="1.4" fill="#141414"/><circle cx="13.5" cy="14.5" r="1.4" fill="#141414"/></svg><div style="font-family: 'Anton', sans-serif; font-size: 22px">-3</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px">{{t.sat}}</div><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 15h9a3.5 3.5 0 0 0 0-7 4.5 4.5 0 0 0-8.6 1.2A3 3 0 0 0 4 15z" fill="#141414"/></svg><div style="font-family: 'Anton', sans-serif; font-size: 22px">1</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px">{{t.sun}}</div><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="#141414"/></svg><div style="font-family: 'Anton', sans-serif; font-size: 22px">3</div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["auto","en","de","ko"],"default":"auto"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var pick = this.props.lang ?? 'auto';
var code = pick;
if (pick === 'auto') {
  var nav = (typeof navigator !== 'undefined' && navigator.language) ? navigator.language.toLowerCase() : 'en';
  code = nav.indexOf('de') === 0 ? 'de' : nav.indexOf('ko') === 0 ? 'ko' : 'en';
}
var S = {
  en: { city: 'Berlin', date: 'Mon, Dec 14 · 12:05', change: 'Change city', cond: 'Snow', feels: 'Feels -6° · High 0° · Low -4°', snowFrom: 'Heavy snow from 2 pm', total: 'About 4 cm', now: 'Now', mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat', sun: 'Sun' },
  de: { city: 'Berlin', date: 'Mo., 14. Dez. · 12:05', change: 'Stadt wechseln', cond: 'Schnee', feels: 'Gefühlt -6° · Max 0° · Min -4°', snowFrom: 'Ab 14 Uhr starker Schneefall', total: 'Etwa 4 cm', now: 'Jetzt', mon: 'Mo', tue: 'Di', wed: 'Mi', thu: 'Do', fri: 'Fr', sat: 'Sa', sun: 'So' },
  ko: { city: '베를린', date: '12월 14일 월 · 12:05', change: '도시 바꾸기', cond: '눈', feels: '체감 -6° · 최고 0° · 최저 -4°', snowFrom: '14시부터 함박눈', total: '약 4cm', now: '지금', mon: '월', tue: '화', wed: '수', thu: '목', fri: '금', sat: '토', sun: '일' }
};
return { t: S[code] || S.en };
}
}
</script>
</body>
</html>

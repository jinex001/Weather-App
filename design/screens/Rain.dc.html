<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weather — Rain</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#E6ECF2}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 24px 28px; background: #4F5D6B; color: #E6ECF2; display: flex; flex-direction: column; font-family: 'Noto Sans KR', sans-serif">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 17px; font-weight: 700">{{t.city}}</div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.04em">{{t.date}}</div>
    </div>
    <button aria-label="{{t.change}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #E6ECF2; background: transparent; color: #E6ECF2; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
    </button>
  </div>

  <div style="display: flex; justify-content: center; margin-top: 28px">
    <svg width="240" height="170" viewBox="0 0 240 170" aria-hidden="true">
      <path d="M96 96h104a28 28 0 0 0 0-56 42 42 0 0 0-80 8 26 26 0 0 0-24 48z" fill="#7A8896"></path>
      <path d="M36 122h120a30 30 0 0 0 0-60 44 44 0 0 0-84 10 26 26 0 0 0-36 50z" fill="#2F3842"></path>
      <path d="M62 136l-8 22M98 136l-8 22M134 136l-8 22M170 112l-8 22" stroke="#8FB8DE" stroke-width="3" stroke-linecap="round"></path>
    </svg>
  </div>

  <div style="font-family: 'Anton', sans-serif; font-size: 240px; line-height: 0.86; text-align: center; letter-spacing: -4px; margin-top: 8px">9<span style="position: relative; top: -0.29em; font-size: 0.8em">°</span></div>
  <div style="position: relative; text-align: center; font-size: 40px; font-weight: 700; margin-top: -20px; line-height: 1.1; letter-spacing: -0.5px; text-shadow: 3px 0 #4F5D6B, -3px 0 #4F5D6B, 0 3px #4F5D6B, 0 -3px #4F5D6B, 2px 2px #4F5D6B, -2px -2px #4F5D6B, 2px -2px #4F5D6B, -2px 2px #4F5D6B">{{t.cond}}</div>
  <div style="text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; margin-top: 6px; letter-spacing: 0.04em">{{t.feels}}</div>

  <div style="flex-grow: 1"></div>

  <div style="border-top: 1.5px solid #E6ECF2; padding: 14px 0 12px; display: flex; flex-direction: column; gap: 10px; border-style: none">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 14px; font-weight: 700">{{t.rainFrom}}</div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px">{{t.max}}</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; align-items: end; height: 48px">
      <div style="height: 4px; background: #8FB8DE"></div>
      <div style="height: 6px; background: #8FB8DE"></div>
      <div style="height: 20px; background: #8FB8DE"></div>
      <div style="height: 34px; background: #8FB8DE"></div>
      <div style="height: 44px; background: #8FB8DE"></div>
      <div style="height: 48px; background: #8FB8DE"></div>
      <div style="height: 40px; background: #8FB8DE"></div>
      <div style="height: 30px; background: #8FB8DE"></div>
      <div style="height: 18px; background: #8FB8DE"></div>
      <div style="height: 10px; background: #8FB8DE"></div>
      <div style="height: 6px; background: #8FB8DE"></div>
      <div style="height: 4px; background: #8FB8DE"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px">
      <div>{{t.now}}</div><div>16</div><div>18</div><div>20</div><div>22</div><div>01</div>
    </div>
  </div>

  <div style="border-top: 1.5px solid #E6ECF2; padding-top: 14px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; text-align: center">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px">{{t.mon}}</div><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 11h9a3 3 0 0 0 0-6 4 4 0 0 0-7.6 1A2.5 2.5 0 0 0 4 11z" fill="#E6ECF2"></path><path d="M6 13.5l-1 2.5M10 13.5l-1 2.5M14 13.5l-1 2.5" stroke="#E6ECF2" stroke-width="1.5" stroke-linecap="round"></path></svg><div style="font-family: 'Anton', sans-serif; font-size: 22px">10</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px">{{t.tue}}</div><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 15h9a3.5 3.5 0 0 0 0-7 4.5 4.5 0 0 0-8.6 1.2A3 3 0 0 0 4 15z" fill="#E6ECF2"></path></svg><div style="font-family: 'Anton', sans-serif; font-size: 22px">12</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px">{{t.wed}}</div><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="#E6ECF2"></circle></svg><div style="font-family: 'Anton', sans-serif; font-size: 22px">14</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px">{{t.thu}}</div><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="#E6ECF2"></circle></svg><div style="font-family: 'Anton', sans-serif; font-size: 22px">15</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px">{{t.fri}}</div><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 15h9a3.5 3.5 0 0 0 0-7 4.5 4.5 0 0 0-8.6 1.2A3 3 0 0 0 4 15z" fill="#E6ECF2"></path></svg><div style="font-family: 'Anton', sans-serif; font-size: 22px">13</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px">{{t.sat}}</div><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 11h9a3 3 0 0 0 0-6 4 4 0 0 0-7.6 1A2.5 2.5 0 0 0 4 11z" fill="#E6ECF2"></path><path d="M6 13.5l-1 2.5M10 13.5l-1 2.5M14 13.5l-1 2.5" stroke="#E6ECF2" stroke-width="1.5" stroke-linecap="round"></path></svg><div style="font-family: 'Anton', sans-serif; font-size: 22px">9</div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["auto","en","de","ko"],"default":"auto"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var pick = this.props.lang ?? 'auto';
var code = pick;
if (pick === 'auto') {
  var nav = (typeof navigator !== 'undefined' && navigator.language) ? navigator.language.toLowerCase() : 'en';
  code = nav.indexOf('de') === 0 ? 'de' : nav.indexOf('ko') === 0 ? 'ko' : 'en';
}
var S = {
  en: { city: 'Berlin', date: 'Sun, Oct 18 · 14:10', change: 'Change city', cond: 'Rain', feels: 'Feels 6° · High 11° · Low 7°', rainFrom: 'Steady rain from 3 pm', max: 'Up to 80%', now: 'Now', mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat', sun: 'Sun' },
  de: { city: 'Berlin', date: 'So., 18. Okt. · 14:10', change: 'Stadt wechseln', cond: 'Regen', feels: 'Gefühlt 6° · Max 11° · Min 7°', rainFrom: 'Ab 15 Uhr Dauerregen', max: 'Bis 80 %', now: 'Jetzt', mon: 'Mo', tue: 'Di', wed: 'Mi', thu: 'Do', fri: 'Fr', sat: 'Sa', sun: 'So' },
  ko: { city: '베를린', date: '10월 18일 일 · 14:10', change: '도시 바꾸기', cond: '비', feels: '체감 6° · 최고 11° · 최저 7°', rainFrom: '15시부터 본격적인 비', max: '최대 80%', now: '지금', mon: '월', tue: '화', wed: '수', thu: '목', fri: '금', sat: '토', sun: '일' }
};
return { t: S[code] || S.en };
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Look Ring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500;600;700;800&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* 시안 (앱 빌드 변화 없음, b249 다음): b225 홈 + 날씨 그림 그림자(b246) + 하단 메뉴 시간 탭(b231)
     + TODAY'S LOOK 줄 오른쪽 필터 버튼(대상·옷 스타일, 저장) + 고른 스타일의 룩만 360° 돌아가는 카드(처음 3장 랜덤) + 아래 기사 타이틀.
     ?lang=en|de, ?mode=flat(평면 무한 비교) */
  :root { --bg: #1B2140; --fg: #F4F1E8; --sans: Poppins, "Noto Sans KR", sans-serif; --display: Anton, "Noto Sans KR", sans-serif;
    --glass-fill: rgba(255,255,255,.5); --glass-blur: blur(24px);
    --glass-light: inset 1px 1px 0 rgba(255,255,255,.8), inset -1px -1px 0 rgba(255,255,255,.2), inset 0 0 20px rgba(255,255,255,.15); }
  body[data-sky="sunny"] { --bg: #7FC1EA; --fg: #141414; }
  body[data-sky="rain"] { --bg: #4F5D6B; --fg: #E6ECF2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #E4E1DA; font-family: var(--sans); letter-spacing: -.02em; }
  .ctl { max-width: 420px; margin: 0 auto; padding: 16px 16px 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .ctl button { font: 600 12px var(--sans); border: 0; border-radius: 16px; padding: 7px 12px; background: rgba(20,20,20,.08); color: #141414; cursor: pointer; }
  .ctl button.on { background: #141414; color: #fff; }
  .phone { position: relative; max-width: 420px; height: 860px; margin: 12px auto 24px; background: var(--bg); color: var(--fg); overflow: hidden; transition: background .3s; }
  .scr { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 30px 24px 120px; scrollbar-width: none; }
  .scr::-webkit-scrollbar { display: none; }
  .scr[hidden] { display: none; }
  /* head (b225 as is, short) */
  .top { display: flex; align-items: baseline; gap: 10px; }
  .city { font: 700 20px var(--sans); }
  .date { font: 500 11px var(--sans); opacity: .8; }
  /* KEEP 1: the moving weather art with the b246 depth shadow */
  .art { display: block; width: 240px; height: 170px; margin: 26px auto 0; overflow: visible;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)) drop-shadow(0 10px 14px rgba(0,0,0,.30)); }
  .art .rays { transform-origin: 120px 86px; animation: spin 18s linear infinite; }
  .art .core { transform-origin: 120px 86px; animation: breathe 4s ease-in-out infinite; }
  .art .moon { transform-origin: 124px 88px; animation: rock 5s ease-in-out infinite; }
  /* stars: each small dot fades almost out and back, on its own beat */
  .art .star { transform-box: fill-box; transform-origin: center; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .15; transform: scale(.7); } }
  .art .drift { animation: drift 16s linear infinite; }
  .art .drop { animation: fall 1.1s cubic-bezier(.5,0,1,1) infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 50% { transform: scale(1.05); } }
  @keyframes rock { 0%, 100% { transform: rotate(-14deg); } 50% { transform: rotate(14deg); } }
  @keyframes drift { from { transform: translateX(-140px); } to { transform: translateX(260px); } }
  @keyframes fall { from { transform: translateY(0); opacity: 1; } to { transform: translateY(40px); opacity: 0; } }
  .temp { text-align: center; font: 200px/.86 var(--display); letter-spacing: -4px; margin-top: 34px; }
  .temp span { font-size: .64em; position: relative; top: -.559em; }
  .cond { text-align: center; font: 700 40px/1.1 var(--sans); text-transform: uppercase; margin-top: -20px; position: relative;
    text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg), 0 0 3px var(--bg); }
  .hl { text-align: center; font: 500 13px var(--sans); margin-top: 16px; }
  .feel { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 24px; }
  .feel small { display: block; font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
  .feel b { display: block; font: 700 15px var(--sans); text-transform: uppercase; }
  .feel i { font: 56px/1 var(--display); font-style: normal; }
  .feel i span { font-size: .72em; position: relative; top: -.41em; }
  /* KEEP 3: TODAY'S LOOK row, filter button moved here on the right */
  .lk-row { display: flex; align-items: center; justify-content: space-between; margin-top: 40px; }
  .k { font: 500 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; }
  .flt { width: 40px; height: 40px; border: 0; border-radius: 50%; display: grid; place-items: center; color: var(--fg); cursor: pointer;
    background: color-mix(in srgb, var(--fg) 12%, transparent); margin-right: -4px; }
  .flt svg { width: 22px; height: 22px; fill: currentColor; }
  /* the look row heading: a sentence now, not a small caps label */
  .lk-h { font: 700 15px/1.3 var(--sans); word-break: keep-all; }
  .flt-now { font: 600 12px var(--sans); opacity: .75; margin-right: 10px; }
  .lk-right { display: flex; align-items: center; }
  /* NEW: the ring. Looks of the chosen style only, endless 360° turn, three in view (front + one each side) */
  .stage { position: relative; height: calc(min(420px, 100vw) * .62 * 1.5 + 30px); margin: 14px -24px 0; perspective: 1100px;
    touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; }
  .stage.grab { cursor: grabbing; }
  .ring { position: absolute; inset: 0; transform-style: preserve-3d; }
  .rc { position: absolute; left: 50%; top: 18px; width: 62%; aspect-ratio: 2 / 3; margin-left: -31%; border-radius: 26px; overflow: hidden;
    backface-visibility: hidden; -webkit-backface-visibility: hidden; background: #2A3050; will-change: transform; }
  .rc img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .rc::after { content: ""; position: absolute; inset: 0; background: #141414; opacity: var(--dim, 0); pointer-events: none; }
  .soon { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; height: 100%; background: #F3EFE8; color: #141414; text-align: center; padding: 20px; }
  .soon b { font: 34px/.95 var(--display); text-transform: uppercase; letter-spacing: 0; }
  .soon small { font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; }
  .title { margin: 16px 0 0 calc(min(420px, 100vw) * .19 - 24px); width: calc(min(420px, 100vw) * .62); font: 40px/.92 var(--display); text-transform: uppercase; letter-spacing: 0; transition: opacity .18s; min-height: 2.8em; }
  .title span { display: block; }
  .title.out { opacity: 0; }
  .dots { display: flex; justify-content: center; gap: 7px; margin-top: 16px; }
  .dots span { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .25; transition: opacity .2s; }
  .dots span.on { opacity: 1; }
  /* first time: pick what you like to wear (ABOUT YOU, b152) */
  .about h2 { font: 44px/.92 var(--display); text-transform: uppercase; letter-spacing: 0; margin: 10px 0 10px; }
  .about p { font: 500 14px/1.5 var(--sans); margin: 0 0 18px; opacity: .85; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { border: 0; background: none; color: inherit; padding: 0; cursor: pointer; text-align: left; }
  .tile .im { aspect-ratio: 3 / 4; display: flex; align-items: flex-end; justify-content: center; }
  .tile img { max-width: 100%; max-height: 100%; }
  .tile b { display: block; font: 22px/1 var(--display); text-transform: uppercase; letter-spacing: 0; margin-top: 8px; }
  .faux { margin-top: 36px; font: 500 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; opacity: .4; text-align: center; }
  /* KEEP 2: the Hours tab (b231) */
  .pg-k { font: 500 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; margin-top: 10px; }
  .pg-h { font: 64px/.9 var(--display); text-transform: uppercase; letter-spacing: 0; margin-top: 8px; }
  .hv-list { margin-top: 22px; }
  .hv { display: flex; align-items: center; gap: 16px; padding: 12px 0; }
  .hv svg { width: 34px; height: 34px; flex: none; }
  .hv-t { width: 52px; flex: none; font: 500 13px var(--sans); }
  .hv.now .hv-t { font-weight: 800; }
  .hv-v { font: 30px var(--display); letter-spacing: 0; width: 64px; }
  .hv-w { margin-left: auto; font: 600 12px var(--sans); }
  .hv-p { width: 44px; text-align: right; font: 500 13px var(--sans); }
  /* bottom menu, five tabs */
  .tabbar { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: 336px; display: flex; justify-content: space-between; padding: 6px;
    border-radius: 40px; background: var(--glass-fill); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-light); z-index: 5; }
  .tabbar button { flex: 1; border: 0; background: none; padding: 11px 0; border-radius: 30px; color: #141414; display: grid; place-items: center; cursor: pointer; }
  .tabbar button.on { background: #141414; color: #fff; }
  .tabbar svg { width: 24px; height: 24px; fill: currentColor; }
  /* sheets (common glass) */
  .sheet { position: absolute; inset: 0; z-index: 9; background: var(--glass-fill); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-light); color: #141414; transform: translateY(102%); transition: transform .4s cubic-bezier(.2,.8,.2,1); overflow-y: auto; padding: 14px 24px 40px; border-radius: 28px 28px 0 0; }
  .sheet.open { transform: none; }
  .sheet.short { top: auto; max-height: 70%; }
  .phone.dim > .scr, .phone.dim > .tabbar { filter: blur(10px); }
  .bar { width: 40px; height: 5px; border-radius: 3px; background: #141414; opacity: .25; margin: 0 auto 20px; cursor: pointer; }
  .sheet .t { font: 44px/.92 var(--display); text-transform: uppercase; letter-spacing: 0; margin: 14px 0; }
  .sheet .ph img { width: 100%; display: block; border-radius: 4px; }
  .sheet .deck { font: 700 18px/1.35 var(--sans); margin-top: 16px; word-break: keep-all; }
  .sheet .intro { font: 500 15px/1.6 var(--sans); margin-top: 12px; word-break: keep-all; }
  .pieces { display: flex; gap: 12px; overflow-x: auto; margin: 22px -24px 0; padding: 0 24px; scrollbar-width: none; }
  .pieces div { flex: 0 0 64%; }
  .pieces .im { aspect-ratio: 1; background: #F3EFE8; display: flex; align-items: center; justify-content: center; }
  .pieces img { max-width: 100%; max-height: 100%; }
  .pieces b { display: block; font: 30px/1 var(--display); text-transform: uppercase; letter-spacing: 0; margin-top: 10px; }
  .pieces small { display: block; font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; margin-top: 10px; }
  .f-k { font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; margin: 18px 0 10px; }
  .seg { display: flex; gap: 4px; padding: 4px; border-radius: 30px; background: rgba(20,20,20,.08); }
  .seg button { flex: 1; border: 0; background: none; border-radius: 26px; padding: 10px 0; font: 700 11.5px var(--sans); letter-spacing: .05em; text-transform: uppercase; color: #141414; cursor: pointer; }
  .seg button.on { background: #141414; color: #fff; }
  .saved { margin-top: 18px; font: 500 12px var(--sans); opacity: .6; }
  .note { max-width: 420px; margin: 0 auto 40px; padding: 0 16px; font: 500 13px/1.6 var(--sans); color: #141414; }
  .note b { font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { .art * { animation: none !important; } }
</style>
</head>

<script>
  var Q = new URLSearchParams(location.search), LANG = (Q.get("lang") || (navigator.language || "en").slice(0, 2)).toLowerCase();
  if (!/^(ko|en|de)$/.test(LANG)) LANG = "en";
  var MODE = Q.get("mode") === "flat" ? "flat" : "ring", SKY = "night", KEY = "wx-ring-proto";
  var T = {
    ko: { lkh: "이 날씨에는 이렇게 입어 봐", sky: { night: "밤", sunny: "맑은 낮", rain: "비" }, cond: { night: "맑음", sunny: "맑음", rain: "비" }, mode: ["360° 링", "평면 무한"], reset: "처음 상태",
      feel: "체감온도", band: "쌀쌀함", hl: "최고 9° · 최저 3° · 바람 14 km/h", hours: "시간별", now: "지금", other: "이 시안에선 홈·시간만",
      ask: "어떤 옷이 좋아요?", askP: "고른 스타일의 룩만 보여 드려요. 나중에 오른쪽 필터에서 바꿀 수 있어요.",
      faux: "… 아래 24시간 예보는 지금 앱 그대로 …", who: "대상", style: "옷 스타일", g: { f: "여성", m: "남성", k: "키즈" },
      saved: "고르면 바로 저장되고 홈이 바뀌어요.", soon: "준비 중", kids: "키즈 룩", st: { run: "Sport", street: "Street", minimal: "Chic" },

    en: { lkh: "Dress like this for this weather", sky: { night: "Night", sunny: "Sunny day", rain: "Rain" }, cond: { night: "Clear", sunny: "Clear", rain: "Rain" }, mode: ["360° ring", "Flat endless"], reset: "First run",
      feel: "Feels like", band: "Chilly", hl: "High 9° · Low 3° · Wind 14 km/h", hours: "Hours", now: "Now", other: "Only Home and Hours in this mockup",
      ask: "What do you like to wear?", askP: "We'll show looks in that style only. Change it later with the filter on the right.",
      faux: "… 24-hour forecast below as in the app …", who: "For", style: "Style", g: { f: "Women", m: "Men", k: "Kids" },
      saved: "Saved as you tap; the home updates right away.", soon: "Coming soon", kids: "Kids looks", st: { run: "Sport", street: "Street", minimal: "Chic" },
      note: "<b>Mockup note</b> · b249 home plus: shadow on the weather art, the Hours tab, and the filter button at the right of the TODAY'S LOOK row. First you pick a style; only that style's looks turn in a 360° ring, the first three in view drawn at random. The front look's article title sits below. 'Flat endless' compares a calendar-like flat loop." },
    de: { lkh: "So ziehst du dich heute an", sky: { night: "Nacht", sunny: "Sonnig", rain: "Regen" }, cond: { night: "Klar", sunny: "Klar", rain: "Regen" }, mode: ["360°-Ring", "Flach endlos"], reset: "Erster Start",
      feel: "Gefühlt", band: "Kühl", hl: "Max 9° · Min 3° · Wind 14 km/h", hours: "Stunden", now: "Jetzt", other: "In diesem Entwurf nur Start und Stunden",
      ask: "Was trägst du gern?", askP: "Wir zeigen nur Looks in diesem Stil. Später rechts im Filter änderbar.",
      faux: "… 24-Stunden-Vorhersage darunter wie in der App …", who: "Für", style: "Stil", g: { f: "Damen", m: "Herren", k: "Kinder" },
      saved: "Wird beim Tippen gespeichert.", soon: "In Arbeit", kids: "Kinder-Looks", st: { run: "Sport", street: "Street", minimal: "Chic" },
      note: "<b>Entwurf</b> · b249-Start plus Schatten am Wetterbild, Stunden-Tab und Filterknopf rechts in der TODAY'S-LOOK-Zeile. Erst Stil wählen; nur dessen Looks drehen sich im 360°-Ring, die ersten drei zufällig." }
  }[LANG];
  var L = null, P = load(), looks = [], pos = 0, shown = -1;
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function tx(v) { return v && typeof v === "object" ? v[LANG] || v.en || v.ko || "" : v || ""; }
  function $(id) { return document.getElementById(id); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // weather head (fake values) with the moving art
  var ART = {
    night: '<mask id="cres"><rect x="-100" y="-100" width="440" height="370" fill="#fff"/><circle cx="146" cy="72" r="40" fill="#000"/></mask>' +
      '<g class="moon"><circle cx="124" cy="88" r="44" fill="#F4F1E8" mask="url(#cres)"/></g>' +
      [[34, 40, 3, 0, 3.2], [62, 112, 2, 1.1, 2.6], [200, 30, 2.5, .5, 3.8], [214, 92, 1.8, 1.8, 2.9], [190, 136, 2, .9, 3.4], [92, 22, 1.6, 2.3, 3]].map(function (s) {
        return '<circle class="star" style="animation-delay:' + s[3] + 's;animation-duration:' + s[4] + 's" cx="' + s[0] + '" cy="' + s[1] + '" r="' + s[2] + '" fill="#F4F1E8"/>'; }).join(""),
    sunny: '<g class="rays">' + [0, 45, 90, 135, 180, 225, 270, 315].map(function (a) { return '<rect x="116" y="18" width="8" height="20" rx="4" fill="#E8621C" transform="rotate(' + a + ' 120 86)"/>'; }).join("") + "</g>" +
      '<circle class="core" cx="120" cy="86" r="40" fill="#E8621C"/>',
    rain: '<g class="drift"><path d="M40 60a14 14 0 0 1 26 -4a12 12 0 0 1 18 10h-44z" fill="#BCC8D4" opacity=".7"/></g>' +
      '<path d="M50 120a32 32 0 0 1 40 -40a40 40 0 0 1 76 12a26 26 0 0 1 10 50h-118a22 22 0 0 1 -8 -22z" fill="#BCC8D4"/>' +
      [70, 98, 126, 154].map(function (x, i) { return '<path class="drop" style="animation-delay:' + (i * .27) + 's" d="M' + x + ' 140c2.3 3.4 4.2 6 4.2 8.4a4.2 4.2 0 0 1 -8.4 0c0-2.4 1.9-5 4.2-8.4z" fill="#8FB8DE"/>'; }).join("")
  };
  function head() {
    document.body.dataset.sky = SKY;
    $("art").innerHTML = ART[SKY];
    $("date").textContent = new Intl.DateTimeFormat(LANG, { weekday: "short", day: "numeric", month: "short" }).format(new Date()) + " · 18:40";
    $("temp").innerHTML = '6<span>°</span>'; $("cond").textContent = T.cond[SKY]; $("hl").textContent = T.hl;
    $("feel-k").textContent = T.feel; $("feel-b").textContent = T.band; $("feel-n").innerHTML = "3<span>°</span>"; $("faux").textContent = T.faux;
  }
  // hours tab, fake 24 rows
  function hours() {
    var h = new Date().getHours(), s = '<div class="pg-k">' + esc(T.hours) + '</div><div class="pg-h">24 ' + esc(T.hours) + '</div><div class="hv-list">';
    for (var n = 0; n < 24; n++) {
      var hr = (h + n) % 24, night = hr < 7 || hr > 18, t = Math.round(6 + 3 * Math.sin((hr - 9) / 24 * 2 * Math.PI)), p = SKY === "rain" ? [80, 90, 70, 55, 40, 30][n % 6] : n % 7 === 3 ? 20 : 0;
      var ic = night ? '<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="9" fill="currentColor"/><circle cx="22" cy="13" r="8" fill="var(--bg)"/></svg>'
        : '<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="6" fill="currentColor"/></svg>';
      s += '<div class="hv' + (n ? "" : " now") + '"><div class="hv-t">' + (n ? (hr < 10 ? "0" : "") + hr + ":00" : esc(T.now)) + "</div>" + ic +
        '<div class="hv-v">' + t + '°</div><div class="hv-w">' + (10 + (n * 3) % 9) + ' km/h</div><div class="hv-p">' + p + "%</div></div>";
    }
    $("pg-hours").innerHTML = s + "</div>";
  }

  // the looks: the chosen style and audience only, chilly, today's sky/time first; shuffled so the first three are random
  function pool() {
    if (P.g === "k") return [];
    var g = P.g || "f", evening = SKY !== "sunny", sky = SKY === "rain" ? "rain" : SKY === "sunny" ? "clear" : null;
    var all = L.outfits.filter(function (o) { return o.style === P.style && o.gender === g && o.article && o.image && (o.bands || []).indexOf("chilly") >= 0 && !o.visualRegion; });
    var fit = all.filter(function (o) { return (o.time === "evening") === evening && (sky ? o.sky === sky : o.sky !== "rain"); });
    if (!fit.length && sky) fit = all.filter(function (o) { return o.sky === sky; });
    if (!fit.length) fit = all.filter(function (o) { return o.sky !== "rain"; });
    return shuffle(fit.length ? fit : all).slice(0, 8);
  }
  function heroCut(st) {
    var g = P.g === "m" ? "m" : "f", o = L.outfits.filter(function (o) { return o.style === st && o.gender === g && o.hero && L.items[o.hero] && (L.items[o.hero].cut || L.items[o.hero].image); })[0];
    return o ? L.items[o.hero].cut || L.items[o.hero].image : "";
  }
  function paintLook() {
    $("lk-h").textContent = T.lkh; $("flt-now").textContent = P.style ? T.g[P.g || "f"] + " · " + T.st[P.style] : "";
    $("flt").style.visibility = P.style ? "" : "hidden";
    if (!P.style) {
      $("look").innerHTML = '<div class="about"><h2>' + esc(T.ask) + "</h2><p>" + esc(T.askP) + '</p><div class="tiles">' +
        ["run", "street", "minimal"].map(function (st) { var c = heroCut(st); return '<button type="button" class="tile" data-st="' + st + '"><div class="im">' + (c ? '<img alt="" src="../' + c + '">' : "") + "</div><b>" + T.st[st] + "</b></button>"; }).join("") + "</div></div>";
      return;
    }
    looks = pool(); pos = 0; shown = -1;
    var cards = looks.length ? looks.map(function (o, i) { return '<div class="rc" data-i="' + i + '"><img alt="" src="../' + o.image + '"></div>'; })
      : [0, 1, 2].map(function (i) { return '<div class="rc" data-i="' + i + '"><div class="soon"><small>' + esc(T.soon) + "</small><b>" + esc(P.g === "k" ? T.kids : T.st[P.style]) + "</b></div></div>"; });
    $("look").innerHTML = '<div class="stage" id="stage"><div class="ring" id="ring">' + cards.join("") + '</div></div><div class="title" id="title"></div><div class="dots" id="dots">' +
      cards.map(function () { return "<span></span>"; }).join("") + "</div>";
    bind(); place();
  }
  // card i sits d places from the front (wrapped into -N/2..N/2): on a cylinder (ring) or flat like the calendar (flat)
  function place() {
    var ring = $("ring"); if (!ring) return;
    var cs = ring.children, N = cs.length, w = cs[0].offsetWidth, front = ((Math.round(pos) % N) + N) % N;
    var step = 360 / Math.max(N, 3), R = (w / 2) / Math.tan(Math.PI / Math.max(N, 3)) + 14;
    [].forEach.call(cs, function (el, i) {
      var d = i - pos; d = ((d % N) + N) % N; if (d > N / 2) d -= N;
      var a = Math.abs(d);
      if (MODE === "ring") {
        el.style.transform = "translateZ(" + (-R).toFixed(1) + "px) rotateY(" + (d * step).toFixed(2) + "deg) translateZ(" + R.toFixed(1) + "px)";
        el.style.opacity = a > 1.6 ? Math.max(0, 1 - (a - 1.6) * 1.5).toFixed(2) : "";
      } else {
        var m = Math.min(a, 2.6), sg = d < 0 ? -1 : 1, e = Math.min(m, 1), ease = e * e * (3 - 2 * e);
        var pull = sg * (m <= 1 ? m * .34 : .34 + (m - 1) * .14) * w;
        el.style.transform = "translateX(" + pull.toFixed(1) + "px) rotate(" + (sg * 3 * ease).toFixed(2) + "deg) scale(" + (1 - .12 * Math.min(m, 2.2)).toFixed(4) + ")";
        el.style.transformOrigin = "50% 100%";
        el.style.opacity = a > 2.2 ? Math.max(0, 1 - (a - 2.2) * 2).toFixed(2) : "";
      }
      el.style.zIndex = 100 - Math.round(a * 10);
      el.style.setProperty("--dim", Math.min(.1 * a, .3).toFixed(3));
    });
    [].forEach.call($("dots").children, function (s, k) { s.className = k === front ? "on" : ""; });
    if (front !== shown) { shown = front; title(looks[front] ? looks[front].article.title : T.soon); }
  }
  var meas = document.createElement("canvas").getContext("2d");
  function title(t) {
    var el = $("title"); el.classList.add("out");
    setTimeout(function () {
      var w = String(t).toUpperCase().split(/\s+/).filter(Boolean), lines = [w.join(" ")], best = Infinity;
      meas.font = "40px " + getComputedStyle(el).fontFamily;
      for (var i = 1; i < w.length; i++) { var a = w.slice(0, i).join(" "), b = w.slice(i).join(" "), m = Math.max(meas.measureText(a).width, meas.measureText(b).width); if (m < best) { best = m; lines = [a, b]; } }
      el.innerHTML = lines.map(function (x) { return "<span>" + esc(x) + "</span>"; }).join(""); el.classList.remove("out");
    }, 180);
  }
  // drag to turn (one card width = one place), flick keeps going, then it settles on the nearest card
  var anim = 0;
  function go(to) {
    cancelAnimationFrame(anim); var from = pos, t0 = performance.now(), dur = 420 + Math.min(600, Math.abs(to - from) * 160);
    (function f(now) { var k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); pos = from + (to - from) * e; place(); if (k < 1) anim = requestAnimationFrame(f); })(t0);
  }
  function bind() {
    var st = $("stage"), x0 = 0, p0 = 0, moved = 0, last = [], down = false;
    st.addEventListener("pointerdown", function (e) { down = true; cancelAnimationFrame(anim); x0 = e.clientX; p0 = pos; moved = 0; last = [[e.clientX, e.timeStamp]]; st.classList.add("grab"); st.setPointerCapture(e.pointerId); });
    st.addEventListener("pointermove", function (e) {
      if (!down) return; var w = $("ring").children[0].offsetWidth, dx = e.clientX - x0;
      moved = Math.max(moved, Math.abs(dx)); pos = p0 - dx / w; place(); last.push([e.clientX, e.timeStamp]); if (last.length > 5) last.shift();
    });
    st.addEventListener("pointerup", function (e) {
      if (!down) return; down = false; st.classList.remove("grab");
      if (moved < 6) {
        var c = document.elementFromPoint(e.clientX, e.clientY), rc = c && c.closest(".rc"); if (!rc) return;
        var N = looks.length || 3, i = +rc.dataset.i, d = i - Math.round(pos); d = ((d % N) + N) % N; if (d > N / 2) d -= N;
        if (d === 0) { if (looks[i]) openSheet(looks[i]); } else go(Math.round(pos) + d);
        return;
      }
      var w = $("ring").children[0].offsetWidth, a = last[0], b = last[last.length - 1], v = (b[0] - a[0]) / Math.max(16, b[1] - a[1]);
      go(Math.round(pos - v * 260 / w));
    });
  }
  function openSheet(o) {
    var items = o.items.map(function (id) { return L.items[id]; }).filter(function (it) { return it && it.image; });
    var s = $("sheet");
    s.innerHTML = '<div class="bar" id="close"></div><div class="k">Today\'s Look</div><div class="t">' + esc(o.article.title) + "</div>" +
      '<div class="ph"><img alt="" src="../' + o.image + '"></div><div class="deck">' + esc(tx(o.deck)) + '</div><div class="intro">' + esc(tx(o.article.intro)) + "</div>" +
      '<div class="pieces">' + items.map(function (it, i) { return '<div><div class="im"><img alt="" src="../' + it.image + '"></div><small>0' + (i + 1) + " · " + esc(it.cat) + "</small><b>" + esc(tx(it.name)) + "</b></div>"; }).join("") + "</div>";
    s.scrollTop = 0; s.classList.add("open"); $("phone").classList.add("dim"); $("close").onclick = closeAll;
  }
  function filterSheet() {
    var g = P.g || "f", s = $("fsheet");
    s.innerHTML = '<div class="bar" id="fclose"></div><div class="f-k">' + esc(T.who) + '</div><div class="seg" data-k="g">' +
      ["f", "m", "k"].map(function (v) { return '<button data-v="' + v + '" class="' + (g === v ? "on" : "") + '">' + esc(T.g[v]) + "</button>"; }).join("") +
      '</div><div class="f-k">' + esc(T.style) + '</div><div class="seg" data-k="style">' +
      ["run", "street", "minimal"].map(function (v) { return '<button data-v="' + v + '" class="' + (P.style === v ? "on" : "") + '">' + T.st[v] + "</button>"; }).join("") +
      '</div><div class="saved">' + esc(T.saved) + "</div>";
    s.classList.add("open"); $("phone").classList.add("dim"); $("fclose").onclick = closeAll;
  }
  function closeAll() { $("sheet").classList.remove("open"); $("fsheet").classList.remove("open"); $("phone").classList.remove("dim"); }
  $("fsheet").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-v]"); if (!b) return;
    P[b.parentNode.dataset.k] = b.dataset.v; save(); filterSheet(); paintLook();
  });
  $("flt").addEventListener("click", filterSheet);
  $("look").addEventListener("click", function (e) { var t = e.target.closest(".tile"); if (t) { P.style = t.dataset.st; if (!P.g) P.g = "f"; save(); paintLook(); } });
  $("tabbar").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return; var t = b.dataset.tab;
    [].forEach.call(this.children, function (x) { x.classList.toggle("on", x === b); });
    $("pg-home").hidden = t !== "home"; $("pg-hours").hidden = t !== "hours"; $("pg-other").hidden = t === "home" || t === "hours";
  });
  $("other").textContent = T.other;
  function ctl() {
    $("ctl").innerHTML = ["night", "sunny", "rain"].map(function (s) { return '<button data-a="' + s + '" class="' + (SKY === s ? "on" : "") + '">' + T.sky[s] + "</button>"; }).join("") +
      '<button data-a="ring" class="' + (MODE === "ring" ? "on" : "") + '">' + T.mode[0] + '</button><button data-a="flat" class="' + (MODE === "flat" ? "on" : "") + '">' + T.mode[1] + "</button>" +
      '<button data-a="reset">' + T.reset + "</button>";
  }
  $("ctl").addEventListener("click", function (e) {
    var a = e.target.dataset.a; if (!a) return;
    if (T.sky[a]) SKY = a; if (a === "ring" || a === "flat") MODE = a; if (a === "reset") { P = {}; save(); }
    closeAll(); ctl(); head(); hours(); paintLook();
  });
  $("note").innerHTML = T.note;
  [].forEach.call($("tabbar").children, function (x) { x.classList.toggle("on", x.dataset.tab === "home"); });
  window.addEventListener("resize", place);
  ctl(); head(); hours();
  fetch("../index.html").then(function (r) { return r.text(); }).then(function (html) {
    var srcs = [], re = /<script src="(look\/[^"]+)"/g, m;
    while ((m = re.exec(html))) srcs.push("../" + m[1]);
    (function next() {
      if (!srcs.length) { L = window.WX_LOOKS; paintLook(); return; }
      var s = document.createElement("script"); s.src = srcs.shift(); s.onload = next; s.onerror = next; document.head.appendChild(s);
    })();
  });
</script>

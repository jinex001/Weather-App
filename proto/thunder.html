<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thunder Art</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500;600;700&family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
  :root { --bolt: #F2C14E; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #E9E6DF; color: #141414; font-family: Poppins, "Noto Sans KR", sans-serif; letter-spacing: -.02em; padding: 24px 16px 60px; }
  h1 { font-family: Anton, sans-serif; font-weight: 400; font-size: 44px; line-height: .95; letter-spacing: 0; }
  .lead { font-size: 14px; font-weight: 500; margin: 10px 0 26px; max-width: 520px; line-height: 1.5; }
  .v { margin-bottom: 34px; }
  .vh { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .vh b { font-family: Anton, sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 0; }
  .vh span { font-size: 13px; font-weight: 600; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .scr { position: relative; border-radius: 22px; overflow: hidden; padding: 14px 0 16px; text-align: center; }
  .day { background: #4F5D6B; color: #E6ECF2; } .night { background: #1B2140; color: #F4F1E8; }
  .scr .art { height: 120px; } .scr .art svg { width: 100%; height: 120px; overflow: hidden; }
  .scr .t { font-family: Anton, sans-serif; font-size: 72px; line-height: .86; letter-spacing: -1px; margin-top: 10px; }
  .scr .c { font-weight: 700; font-size: 15px; text-transform: uppercase; margin-top: 4px; }
  .row { display: flex; justify-content: center; gap: 6px; margin-top: 14px; }
  .row svg { width: 44px; height: 31px; overflow: hidden; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  /* app art motion (copied from index.html) */
  .art-tear { opacity: 0; animation: art-tear 1.1s cubic-bezier(.5,0,1,1) infinite; }
  @keyframes art-tear { 0% { opacity: 0; transform: translateY(-4px); } 15%,80% { opacity: 1; } 100% { opacity: 0; transform: translateY(26px); } }
  .art-drift { animation: art-drift linear infinite; }
  @keyframes art-drift { from { transform: translateX(-200px); } to { transform: translateX(440px); } }
  /* small icons: only drops move (as b259) */
  .row svg *:not(.art-tear) { animation: none !important; }
  /* A: the bolt flashes twice every 4 s */
  .bA { animation: bolt 4s linear infinite; }
  @keyframes bolt { 0%, 100% { opacity: 0; } 60% { opacity: 0; } 61%, 63% { opacity: 1; } 64%, 66% { opacity: 0; } 67%, 70% { opacity: 1; } 74% { opacity: 0; } }
  /* B: A + the cloud underside lights up and the screen brightens a touch */
  .lit { animation: lit 4s linear infinite; }
  @keyframes lit { 0%, 60%, 100% { opacity: 0; } 61%, 63% { opacity: .55; } 64%, 66% { opacity: 0; } 67%, 70% { opacity: .55; } 76% { opacity: 0; } }
  .vB .flash { animation: fl 4s linear infinite; }
  @keyframes fl { 0%, 60%, 100% { opacity: 0; } 61%, 63% { opacity: .10; } 64%, 66% { opacity: 0; } 67%, 70% { opacity: .08; } 78% { opacity: 0; } }
  /* C: bolt always there, only a soft glow pulse */
  .bC { animation: glowC 3s ease-in-out infinite; }
  @keyframes glowC { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .art-tear { opacity: 1; } .bA { opacity: 1; } }
</style></head><body>
<h1>THUNDER<br>시안</h1>
<p class="lead">지금은 뇌우(95–99)도 강한 비 그림 그대로예요. 앞 구름 아래로 노란 번개(#F2C14E, 프로젝트 첫 색)를 넣은 세 가지예요. 위 큰 그림은 홈, 아래 작은 4개는 24시간 아이콘(b259처럼 빗방울만 움직이고 번개는 멈춘 채)이에요. 왼쪽 비 오는 낮, 오른쪽 밤.</p>
<div id="v"></div>
<script>
var ART = {"day": "<svg viewBox=\"0 0 240 170\"><g class=\"art-drift\" style=\"animation-duration:22s;animation-delay:-6s\"><path transform=\"translate(0 2) scale(0.3)\" d=\"M36 122h120a30 30 0 0 0 0-60 44 44 0 0 0-84 10 26 26 0 0 0-36 50z\" style=\"fill:#7A8896\"></path></g><g class=\"art-drift\" style=\"animation-duration:28s;animation-delay:-18s\"><path transform=\"translate(0 30) scale(0.24)\" d=\"M36 122h120a30 30 0 0 0 0-60 44 44 0 0 0-84 10 26 26 0 0 0-36 50z\" style=\"fill:#6B7886\"></path></g><path d=\"M96 96h104a28 28 0 0 0 0-56 42 42 0 0 0-80 8 26 26 0 0 0-24 48z\" fill=\"#7A8896\"></path><g fill=\"#8FB8DE\"><path class=\"art-tear\" style=\"animation-delay: 0s;\" d=\"M58 126c2.3 3.4 4.2 6.1 4.2 8.4a4.2 4.2 0 0 1-8.4 0c0-2.3 1.9-5.0 4.2-8.4z\"></path><path class=\"art-tear\" style=\"animation-delay: 0.45s;\" d=\"M78 132c2.3 3.4 4.2 6.1 4.2 8.4a4.2 4.2 0 0 1-8.4 0c0-2.3 1.9-5.0 4.2-8.4z\"></path><path class=\"art-tear\" style=\"animation-delay: 0.2s;\" d=\"M98 126c2.3 3.4 4.2 6.1 4.2 8.4a4.2 4.2 0 0 1-8.4 0c0-2.3 1.9-5.0 4.2-8.4z\"></path><path class=\"art-tear\" style=\"animation-delay: 0.65s;\" d=\"M118 132c2.3 3.4 4.2 6.1 4.2 8.4a4.2 4.2 0 0 1-8.4 0c0-2.3 1.9-5.0 4.2-8.4z\"></path><path class=\"art-tear\" style=\"animation-delay: 0.35s;\" d=\"M138 126c2.3 3.4 4.2 6.1 4.2 8.4a4.2 4.2 0 0 1-8.4 0c0-2.3 1.9-5.0 4.2-8.4z\"></path><path class=\"art-tear\" style=\"animation-delay: 0.8s;\" d=\"M160 130c2.3 3.4 4.2 6.1 4.2 8.4a4.2 4.2 0 0 1-8.4 0c0-2.3 1.9-5.0 4.2-8.4z\"></path></g><path d=\"M36 122h120a30 30 0 0 0 0-60 44 44 0 0 0-84 10 26 26 0 0 0-36 50z\" fill=\"#2F3842\"></path><g class=\"art-drift\" style=\"animation-duration:18s;animation-delay:-10s\"><path transform=\"translate(0 120) scale(0.28)\" d=\"M36 122h120a30 30 0 0 0 0-60 44 44 0 0 0-84 10 26 26 0 0 0-36 50z\" style=\"fill:#6B7886\"></path></g></svg>", "night": "<svg viewBox=\"0 0 240 170\"><mask id=\"artm1\"><rect x=\"-300\" y=\"-300\" width=\"900\" height=\"800\" fill=\"#fff\"></rect><circle cx=\"184\" cy=\"40\" r=\"26\" fill=\"#000\"></circle></mask><circle cx=\"170\" cy=\"50\" r=\"30\" fill=\"#D9D2B8\" mask=\"url(#artm1)\"></circle><g class=\"art-drift\" style=\"animation-duration:22s;animation-delay:-6s\"><path transform=\"translate(0 2) scale(0.3)\" d=\"M36 122h120a30 30 0 0 0 0-60 44 44 0 0 0-84 10 26 26 0 0 0-36 50z\" style=\"fill:#3A4454\"></path></g><g class=\"art-drift\" style=\"animation-duration:28s;animation-delay:-18s\"><path transform=\"translate(0 30) scale(0.24)\" d=\"M36 122h120a30 30 0 0 0 0-60 44 44 0 0 0-84 10 26 26 0 0 0-36 50z\" style=\"fill:#5D6979\"></path></g><g fill=\"#8FB8DE\"><path class=\"art-tear\" style=\"animation-delay: 0s;\" d=\"M58 126c2.3 3.4 4.2 6.1 4.2 8.4a4.2 4.2 0 0 1-8.4 0c0-2.3 1.9-5.0 4.2-8.4z\"></path><path class=\"art-tear\" style=\"animation-delay: 0.45s;\" d=\"M78 132c2.3 3.4 4.2 6.1 4.2 8.4a4.2 4.2 0 0 1-8.4 0c0-2.3 1.9-5.0 4.2-8.4z\"></path><path class=\"art-tear\" style=\"animation-delay: 0.2s;\" d=\"M98 126c2.3 3.4 4.2 6.1 4.2 8.4a4.2 4.2 0 0 1-8.4 0c0-2.3 1.9-5.0 4.2-8.4z\"></path><path class=\"art-tear\" style=\"animation-delay: 0.65s;\" d=\"M118 132c2.3 3.4 4.2 6.1 4.2 8.4a4.2 4.2 0 0 1-8.4 0c0-2.3 1.9-5.0 4.2-8.4z\"></path><path class=\"art-tear\" style=\"animation-delay: 0.35s;\" d=\"M138 126c2.3 3.4 4.2 6.1 4.2 8.4a4.2 4.2 0 0 1-8.4 0c0-2.3 1.9-5.0 4.2-8.4z\"></path><path class=\"art-tear\" style=\"animation-delay: 0.8s;\" d=\"M160 130c2.3 3.4 4.2 6.1 4.2 8.4a4.2 4.2 0 0 1-8.4 0c0-2.3 1.9-5.0 4.2-8.4z\"></path></g><path d=\"M36 122h120a30 30 0 0 0 0-60 44 44 0 0 0-84 10 26 26 0 0 0-36 50z\" fill=\"#4A5666\"></path><g class=\"art-drift\" style=\"animation-duration:18s;animation-delay:-10s\"><path transform=\"translate(0 120) scale(0.28)\" d=\"M36 122h120a30 30 0 0 0 0-60 44 44 0 0 0-84 10 26 26 0 0 0-36 50z\" style=\"fill:#5D6979\"></path></g></svg>"};
var BOLT = '<path d="M114 100L94 142h14l-11 30 30-44h-14l10-28z"/>';
var LIT = '<path d="M36 122h120a30 30 0 0 0 0-60 44 44 0 0 0-84 10 26 26 0 0 0-36 50z" fill="#C9D3DD"/>';
var n = 0;
function art(key, v, small) {
  var s = ART[key].replace(/artm1/g, "m" + (++n));
  var front = '<path d="M36 122h120a30 30 0 0 0 0-60 44 44 0 0 0-84 10 26 26 0 0 0-36 50z" fill="';
  var i = s.indexOf(front);
  // bolt goes behind the front cloud so it comes out of its bottom edge
  var cls = small ? "" : v === "C" ? "bC" : "bA";
  var bolt = '<g class="' + cls + '" fill="#F2C14E">' + BOLT + "</g>";
  s = s.slice(0, i) + bolt + s.slice(i);
  if (v === "B" && !small) {
    var j = s.indexOf("</svg>", s.indexOf(front));
    var k = s.indexOf("></path>", s.indexOf(front)) + 8;
    s = s.slice(0, k) + '<g class="lit" style="mix-blend-mode:screen">' + LIT + "</g>" + s.slice(k);
  }
  return s;
}
var VS = [["A", "번쩍 두 번", "4초마다 번개가 두 번 짧게 번쩍. 나머지는 지금 비 그림 그대로."],
          ["B", "번쩍 + 구름 밝아짐", "A에 더해 번쩍일 때 앞 구름 아랫면이 밝아지고 화면도 아주 살짝 환해짐."],
          ["C", "늘 보이는 번개", "번개가 항상 보이고 은은하게 숨쉬기만. 가장 차분함."]];
var out = "";
VS.forEach(function (v) {
  out += '<section class="v v' + v[0] + '"><div class="vh"><b>' + v[0] + "</b><span>" + v[1] + "</span></div><p class='lead' style='margin:0 0 10px'>" + v[2] + '</p><div class="pair">';
  [["day", "day"], ["night", "night"]].forEach(function (p) {
    out += '<div class="scr ' + p[1] + '"><div class="flash"></div><div class="art">' + art(p[0], v[0]) + '</div><div class="t">7°</div><div class="c">Thunderstorm</div><div class="row">' +
      [0, 1, 2, 3].map(function () { return art(p[0], v[0], true); }).join("") + "</div></div>";
  });
  out += "</div></section>";
});
document.getElementById("v").innerHTML = out;
</script></body></html>

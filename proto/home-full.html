<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Full Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500;600;700;800&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* 시안 (앱 빌드 변화 없음): 홈 첫 화면 = 오늘의 픽 에디토리얼 사진을 화면 가득, 그 위에 날씨.
     좌우로 밀면 러닝·스트리트·시크 사진이 바뀜, 아래로 내리면 사진은 뒤에 남고 글라스 위로 기사, 기사 안 제품 카드 가로 스와이프.
     ?lang=en|de, ?g=f, ?sky=sunny|cloudy|night|rain */
  :root { --sans: Poppins, "Noto Sans KR", sans-serif; --display: Anton, "Noto Sans KR", sans-serif;
    --glass-fill: rgba(255,255,255,.5); --glass-blur: blur(24px);
    --glass-light: inset 1px 1px 0 rgba(255,255,255,.8), inset -1px -1px 0 rgba(255,255,255,.2), inset 0 0 20px rgba(255,255,255,.15);
    --wx: #1B2140; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #E4E1DA; color: #141414; font-family: var(--sans); letter-spacing: -.02em; }
  .ctl { max-width: 420px; margin: 0 auto; padding: 16px 16px 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .ctl button { font: 600 12px var(--sans); border: 0; border-radius: 16px; padding: 7px 12px; background: rgba(20,20,20,.08); color: #141414; cursor: pointer; }
  .ctl button.on { background: #141414; color: #fff; }
  /* the phone: one vertical scroller. The hero is sticky, so the article slides up over it */
  .phone { position: relative; max-width: 420px; height: min(860px, calc(100svh - 24px)); margin: 12px auto 24px; background: var(--wx); overflow: hidden; border-radius: 22px; }
  @media (max-width: 440px) { .phone { height: 100svh; margin: 0 auto; border-radius: 0; } .ctl { position: fixed; z-index: 50; top: 0; left: 0; right: 0; padding: 6px 8px; } .ctl button { padding: 5px 9px; font-size: 11px; background: rgba(255,255,255,.55); } .note { display: none; } }
  .scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .hero { position: sticky; top: 0; height: 100%; overflow: hidden; z-index: 0; }
  /* style swipe: three full-bleed photos, snap; flat dark film over them (no gradient), text on top passes touches through */
  .rail { position: absolute; inset: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
  .rail::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always; position: relative; }
  .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slide::after { content: none; }
  .soon { width: 100%; height: 100%; background: var(--wx); display: flex; align-items: center; justify-content: center; color: #F4F1E8; font: 600 12px var(--sans); letter-spacing: .06em; text-transform: uppercase; }
  .over { position: absolute; inset: 0; pointer-events: none; color: #fff; padding: 52px 20px 44px; display: flex; flex-direction: column; }
  .loc { display: none; align-items: baseline; gap: 8px; }
  .loc b { font: 700 20px var(--sans); }
  .loc span { font: 500 11px var(--sans); opacity: .85; }
  .now { display: flex; align-items: center; gap: 10px; }
  .cw { display: flex; align-items: baseline; gap: 10px; margin-top: 2px; }
  .temp { font: 800 68px/.9 var(--sans); letter-spacing: -.04em; margin-top: 4px; }
  .temp sup { font-size: .5em; font-weight: 600; vertical-align: top; line-height: 1; position: relative; top: .06em; margin-left: .04em; }
  .cond { font: 800 18px/1.1 var(--sans); text-transform: uppercase; letter-spacing: -.02em; }
  .feels { display: none; }
  .feels i { display: inline-block; width: 5px; height: 1.05em; vertical-align: -.15em; margin: 0 6px 0 4px; border-radius: 1px; background: #58C4DC; }
  /* the app's animated weather art (copied from index.html ART + .art-* CSS), smaller, beside the temperature;
     drifting clouds run past its box across the photo */
  .ico { width: 132px; height: 93px; margin-left: -12px; overflow: visible; }
  .ico svg { width: 132px; height: 93px; overflow: visible; display: block; }
  body { --oc-back: #7E766C; --oc-drift: #7A8287; }
  .art-drop { opacity: 0; animation: art-fall .9s linear infinite; }
  /* rain (b154): teardrops falling straight down from under the clouds, speeding up */
  .art-tear { opacity: 0; animation: art-tear 1.1s cubic-bezier(.5,0,1,1) infinite; }
  /* drops falling onto the big number and splashing (b155), built by rainFx */
  .app { position: relative; }
  .rfx { position: absolute; left: 0; top: 0; width: 100%; pointer-events: none; z-index: 1; }
  .rfx svg { position: absolute; left: 0; top: 0; overflow: visible; }
  /* showers (b194): rain for half of each 3.2s, then the sun comes out from behind the cloud until the next burst */
  .sh-rain, .rfx svg.rf-burst { animation: sh-rain 3.2s step-end infinite; }
  @keyframes sh-rain { 0% { visibility: visible; } 50% { visibility: hidden; } }
  .sh-out { transform-origin: 198px 54px; animation: sh-out 3.2s ease-in-out infinite; }
  @keyframes sh-out { 0%,45% { transform: translate(0,0) scale(1); } 58%,88% { transform: translate(8px,-8px) scale(1.18); } 100% { transform: translate(0,0) scale(1); } }
  .sh-rays { transform-origin: 198px 54px; animation: art-spin 18s linear infinite; }
  .rf-s { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
  .rf-ring { animation-name: rf-ring; } .rf-l { animation-name: rf-l; } .rf-r { animation-name: rf-r; } .rf-c { animation-name: rf-c; }
  @keyframes rf-ring { 0%,62% { opacity: 0; transform: scale(.2); } 63% { opacity: 1; transform: scale(.3); } 85% { opacity: 0; transform: scale(1.5); } 100% { opacity: 0; } }
  @keyframes rf-l { 0%,62% { opacity: 0; transform: translate(0,0); } 63% { opacity: 1; } 72% { transform: translate(-7px,-9px); } 84% { opacity: .8; transform: translate(-11px,-2px); } 88%,100% { opacity: 0; transform: translate(-12px,1px); } }
  @keyframes rf-r { 0%,62% { opacity: 0; transform: translate(0,0); } 63% { opacity: 1; } 72% { transform: translate(7px,-10px); } 84% { opacity: .8; transform: translate(11px,-3px); } 88%,100% { opacity: 0; transform: translate(12px,1px); } }
  @keyframes rf-c { 0%,63% { opacity: 0; transform: translate(0,0); } 64% { opacity: 1; } 73% { transform: translate(0,-12px); } 82%,100% { opacity: 0; transform: translate(0,-4px); } }
  @keyframes art-tear { 0% { opacity: 0; transform: translateY(-4px); } 15%,80% { opacity: 1; } 100% { opacity: 0; transform: translateY(26px); } }
  /* drizzle (b141): many fine short lines drifting down slowly across the whole screen width */
  .art-dz { opacity: 0; animation: art-dz 2s linear infinite; }
  @keyframes art-dz { 0% { opacity: 0; transform: translate(1px,-8px); } 25%,75% { opacity: .85; } 100% { opacity: 0; transform: translate(-2px,12px); } }
  /* showers (codes 80–82, b142): two groups of drops take turns, so the rain comes in bursts with short breaks */
  .art-on1 { animation: art-on1 3.2s step-end infinite; }
  .art-on2 { animation: art-on2 3.2s step-end infinite; }
  @keyframes art-on1 { 0% { visibility: visible; } 47% { visibility: hidden; } }
  @keyframes art-on2 { 0% { visibility: hidden; } 62% { visibility: visible; } 95% { visibility: hidden; } }
  @keyframes art-fall { 0% { opacity: 0; transform: translate(3px,-14px); } 15%,85% { opacity: 1; } 100% { opacity: 0; transform: translate(-5px,16px); } }
  .art-sun { transform-origin: 120px 80px; animation: art-glow 2.6s ease-in-out infinite; }
  .art-sun-sm { transform-origin: 168px 54px; }
  @keyframes art-glow { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .art-rays { transform-origin: 120px 80px; animation: art-spin 18s linear infinite; }
  .art-rays line { animation: art-ray 1.6s ease-in-out infinite; }
  .art-rays line:nth-child(even) { animation-delay: .8s; }
  @keyframes art-spin { to { transform: rotate(360deg); } }
  @keyframes art-ray { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .art-bob { animation: art-bob 5s ease-in-out infinite; }
  @keyframes art-bob { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
  .art-drift { animation: art-drift linear infinite; }
  @keyframes art-drift { from { transform: translateX(-200px); } to { transform: translateX(440px); } }
  /* partly cloudy (b198): the small clouds never leave the screen together, see ART.sunCloudy */
  .pc-drift { animation: pc-drift 38s linear infinite; }
  @keyframes pc-drift { 0% { opacity: 0; transform: translateX(-20px); } 8%, 92% { opacity: 1; } 100% { opacity: 0; transform: translateX(210px); } }
  /* clear night (b199): the crescent rocks ±14° in place, 5s */
  .moon-rock { transform-origin: 124px 88px; animation: moon-rock 5s ease-in-out infinite; }
  @keyframes moon-rock { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(14deg); } }
  .art-star { animation: art-tw 2.4s ease-in-out infinite; }
  @keyframes art-tw { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
  .art-fog { animation: art-fog 7s ease-in-out infinite alternate; }
  @keyframes art-fog { from { transform: translateX(-10px); } to { transform: translateX(10px); } }
  .art-flake { opacity: 0; animation: art-snow 3s linear infinite; }
  @keyframes art-snow { 0% { opacity: 0; transform: translate(0,-16px); } 15%,85% { opacity: 1; } 50% { transform: translate(5px,6px); } 100% { opacity: 0; transform: translate(-3px,30px); } }
  @media (prefers-reduced-motion: reduce) { .ico * { animation: none !important; } .art-drop, .art-dz, .art-tear, .art-flake { opacity: 1; } }
  .bot { margin-top: auto; }
  .kick { display: none; font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; opacity: .9; }
  .title { font: 800 34px/1.02 var(--sans); text-transform: uppercase; letter-spacing: -.03em; margin-top: 36px; transition: opacity .18s; }
  .title span { display: block; }
  .title.out, .deck0.out { opacity: 0; }
  .deck0 { display: none; font: 600 14px/1.45 var(--sans); margin-top: 10px; max-width: 320px; word-break: keep-all; transition: opacity .18s; }
  .umb { font: 700 13px/1.4 var(--sans); margin-top: 6px; }
  .umb[hidden] { display: none; }
  .row { display: none; align-items: center; justify-content: space-between; margin-top: 18px; }
  .dots { display: flex; gap: 7px; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: .4; transition: opacity .2s; }
  .dots span.on { opacity: 1; }
  .more { font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; animation: nudge 2.4s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateY(4px); } }
  /* the article: common glass over the photo, slides up as you scroll */
  .art { position: relative; z-index: 1; border-radius: 28px 28px 0 0; padding: 14px 24px 120px; min-height: 100%;
    background: var(--glass-fill); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-light); }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: #141414; opacity: .25; margin: 0 auto 22px; }
  .art .kick { opacity: .7; }
  .art .t { font: 44px/.92 var(--display); text-transform: uppercase; letter-spacing: 0; margin: 10px 0 0; }
  .art .deck { font: 700 18px/1.35 var(--sans); margin-top: 16px; word-break: keep-all; }
  .art .intro { font: 500 15px/1.6 var(--sans); margin-top: 12px; word-break: keep-all; }
  .sec { font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; margin-top: 30px; opacity: .7; display: flex; justify-content: space-between; }
  .pieces { display: flex; gap: 12px; overflow-x: auto; margin: 12px -24px 0; padding: 0 24px; scroll-snap-type: x mandatory; scroll-padding: 24px; scrollbar-width: none; }
  .pieces::-webkit-scrollbar { display: none; }
  .pc { flex: 0 0 calc(100% - 56px); scroll-snap-align: start; }
  .pc .im { aspect-ratio: 1; background: #F3EFE8; border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .pc .im img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .pc small { display: block; font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; margin-top: 12px; opacity: .7; }
  .pc b { display: block; font: 34px/1 var(--display); text-transform: uppercase; letter-spacing: 0; margin-top: 6px; }
  :lang(ko) .pc b { font: 700 30px/1.15 "Noto Sans KR", sans-serif; }
  .pc p { font: 500 15px/1.55 var(--sans); margin: 8px 0 0; word-break: keep-all; }
  .pull { margin-top: 36px; font: 34px/1.02 var(--display); text-transform: uppercase; letter-spacing: 0; }
  .tip { margin-top: 18px; font: 700 15px/1.5 var(--sans); word-break: keep-all; }
  .hrs { display: flex; gap: 18px; overflow-x: auto; margin: 12px -24px 0; padding: 0 24px; scrollbar-width: none; }
  .hrs div { flex: none; text-align: center; font: 500 12px var(--sans); }
  .hrs b { display: block; font: 600 15px var(--sans); margin-top: 6px; }
  .note { max-width: 420px; margin: 0 auto 40px; padding: 0 16px; font: 500 13px/1.6 var(--sans); }
  .note b { font-weight: 700; }
  /* ── Figma 1:2 (사용자 디자인) ── */
  .over { padding: 22px 22px 22px 12px; }
  .wx { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
  .city { font: 800 18px/1.1 var(--sans); letter-spacing: -.02em; }
  .wx .ico, .wx .ico svg { width: 150px; height: 106px; }
  .wx .ico { margin: 2px -26px 0 0; }
  .wx .temp { font: 800 56px/.9 var(--sans); letter-spacing: -.04em; margin-top: 18px; }
  .wx .cond { font: 800 16px/1.1 var(--sans); letter-spacing: -.02em; text-transform: uppercase; margin-top: 2px; }
  .fl { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .fll { font: 700 11px/1.3 var(--sans); }
  .fp { width: 16px; height: 18px; }
  .fln { font: 800 36px/.9 var(--sans); letter-spacing: -.04em; }
  .fln sup { font-size: .5em; font-weight: 600; vertical-align: top; line-height: 1; position: relative; top: .06em; }
  .wx .umb { font-size: 12px; margin-top: 10px; max-width: 220px; }
  .bot .kick { display: block; font: 700 12px/1.2 var(--sans); letter-spacing: -.01em; text-transform: none; opacity: 1; }
  .bot .title { font: 800 30px/1.03 var(--sans); letter-spacing: -.03em; margin-top: 8px; }
  /* Figma 1:2 수정: 사진 위 글자에 1px 검정 테두리(어떤 사진에서도 읽히게), 사람 아이콘도 */
  .over { text-shadow: 1px 0 0 #000, -1px 0 0 #000, 0 1px 0 #000, 0 -1px 0 #000, 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
  .fp path, .fp circle { stroke: #000; stroke-width: 1.5px; paint-order: stroke; }
  /* 기온 + 상태: 상태는 숫자 오른쪽 끝에 맞추고 글자 높이 반이 숫자와 겹침; ° 는 숫자 오른쪽에 겹쳐 반쯤 올라감 */
  .tc { display: flex; flex-direction: column; align-items: flex-end; margin: 18px 16px 0 0; }
  .tc .temp { position: relative; margin-top: 0; }
  .tc .temp sup { position: absolute; left: calc(100% - 7px); top: -2px; font-size: .55em; font-weight: 700; line-height: 1; margin: 0; }
  .tc .cond { position: relative; margin-top: -14px; }
  /* ── Figma 14:36: 날씨도 왼쪽 아래로, 왼쪽 정렬 ── */
  .over { padding: 22px 20px 30px 12px; }
  .wx { margin-top: auto; align-items: flex-start; text-align: left; }
  .city { font-size: 15px; }
  .ar { position: relative; display: flex; align-items: flex-end; margin-top: 18px; }
  .wx .ico, .wx .ico svg { width: 150px; height: 106px; }
  .wx .ico { margin: 0 0 0 -12px; }
  .ar .fp { margin: 0 0 30px 18px; width: 15px; height: 17px; }
  .tc { align-items: flex-start; margin: 18px 0 0; }
  .wx .temp { font-size: 64px; }
  .tc .cond { margin-top: -15px; font-size: 15px; }
  .wx .umb { max-width: 300px; }
  .bot { margin-top: 26px; }
  .bot .kick { font-size: 11px; }
  .bot .title { font-size: 28px; margin-top: 6px; }
  /* ── 글자 묶음이 사진의 빈 쪽으로: 사진 아래쪽 왼편·오른편 중 덜 복잡한 쪽(sideFor)에 붙음, 넘길 때마다 페이드로 옮겨 감 ── */
  .over > .wx, .over > .bot { transition: opacity .2s; }
  .over.moving > .wx, .over.moving > .bot { opacity: 0; }
  .over[data-side="right"] { padding-left: 20px; padding-right: 12px; }
  .over[data-side="right"] .wx { align-items: flex-end; text-align: right; }
  .over[data-side="right"] .bot { text-align: right; }
  .over[data-side="right"] .ar { flex-direction: row-reverse; }
  .over[data-side="right"] .wx .ico { margin: 0 -12px 0 0; }
  .over[data-side="right"] .ar .fp { margin: 0 18px 30px 0; }
  .over[data-side="right"] .tc { align-items: flex-end; margin-right: 16px; }
</style>
</head>
<body>
<div class="ctl" id="ctl"></div>
<div class="phone" id="phone">
  <div class="scroll" id="scroll">
    <section class="hero" id="hero">
      <div class="rail" id="rail"></div>
      <div class="over">
        <!-- Figma 14:36: everything bottom left, left-aligned: place → art (+ person) → temp + condition → Today's <style> → title -->
        <div class="wx">
          <div class="city">Berlin</div>
          <div class="ar"><div class="ico" id="ico" aria-hidden="true"></div><svg class="fp" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="3.2" fill="currentColor"/><path d="M7 21v-7.5C7 10.6 9.2 9.5 12 9.5s5 1.1 5 4V21z" fill="currentColor"/></svg></div>
          <div class="tc"><div class="temp" id="temp"></div><div class="cond" id="cond"></div></div>
          <div class="umb" id="umb" hidden></div>
          <div hidden><div id="fll"></div><div id="fln"></div></div>
        </div>
        <div class="bot">
          <div class="kick" id="kick"></div>
          <div class="title" id="title"></div>
        </div>
        <div hidden><span id="date"></span><span id="feels"></span><span id="deck0"></span><span id="dots"></span><span id="more"></span></div>
      </div>
    </section>
    <article class="art" id="art"></article>
  </div>
</div>
<div class="note" id="note"></div>
<script>
  var Q = new URLSearchParams(location.search), LANG = (Q.get("lang") || (navigator.language || "en").slice(0, 2)).toLowerCase();
  if (!/^(ko|en|de)$/.test(LANG)) LANG = "en";
  document.documentElement.lang = LANG;
  var G = Q.get("g") === "f" ? "f" : "m", SKY = /^(sunny|cloudy|night|rain)$/.test(Q.get("sky")) ? Q.get("sky") : "cloudy";
  var WX = { sunny: { bg: "#7FC1EA", t: 8, f: 6 }, cloudy: { bg: "#959B9E", t: 7, f: 4 }, night: { bg: "#1B2140", t: 6, f: 3 }, rain: { bg: "#4F5D6B", t: 7, f: 4 } };
  var T = {
    ko: { sky: { sunny: "맑음", cloudy: "흐림", night: "밤", rain: "비" }, g: ["남성", "여성"], cond: { sunny: "맑음", cloudy: "흐림", night: "맑은 밤", rain: "비" },

    if (!o) { a.innerHTML = '<div class="grab"></div><div class="kick">' + esc(T.st[STY[k]]) + '</div><div class="t">' + esc(T.soon) + '</div><div class="sec">' + esc(T.next) + '</div><div class="hrs">' + hrs + "</div>"; return; }
    var items = o.items.map(function (id) { return L.items[id]; }).filter(function (it) { return it && it.image; });
    a.innerHTML = '<div class="grab"></div><div class="kick">Today\'s Look · ' + esc(T.st[STY[k]]) + '</div><div class="t">' + esc(o.article.title) + "</div>" +
      '<div class="deck">' + esc(tx(o.deck)) + '</div><div class="intro">' + esc(tx(o.article.intro)) + "</div>" +
      '<div class="sec"><span>' + esc(T.pieces) + "</span><span>" + items.length + "</span></div>" +
      '<div class="pieces">' + items.map(function (it, i) {
        return '<div class="pc"><div class="im"' + (it.bg && /^#/.test(it.bg) ? ' style="background:' + it.bg + '"' : "") + '><img alt="" loading="lazy" src="../' + it.image + '"></div><small>' + String(i + 1).padStart(2, "0") + " · " + esc(CAT[it.cat] || it.cat) + "</small><b>" + esc(tx(it.name)) + "</b>" + (it.note ? "<p>" + esc(tx(it.note)) + "</p>" : "") + "</div>";
      }).join("") + "</div>" +
      (o.article.pull ? '<div class="pull">' + esc(tx(o.article.pull)) + "</div>" : "") +
      (o.article.tip ? '<div class="tip">' + esc(tx(o.article.tip)) + "</div>" : "") +
      '<div class="sec">' + esc(T.next) + '</div><div class="hrs">' + hrs + "</div>";
  }
  var rail = document.getElementById("rail"), tm;
  rail.addEventListener("scroll", function () {
    clearTimeout(tm);
    tm = setTimeout(function () { var k = Math.round(rail.scrollLeft / rail.clientWidth); if (k !== at) show(k); }, 80);
  }, { passive: true });
  document.getElementById("more").parentNode.addEventListener("click", function () {});
  function ctl() {
    document.getElementById("ctl").innerHTML = ["sunny", "cloudy", "night", "rain"].map(function (s) { return '<button data-a="' + s + '" class="' + (SKY === s ? "on" : "") + '">' + T.sky[s] + "</button>"; }).join("") +
      '<button data-a="m" class="' + (G === "m" ? "on" : "") + '">' + T.g[0] + '</button><button data-a="f" class="' + (G === "f" ? "on" : "") + '">' + T.g[1] + "</button>";
  }
  document.getElementById("ctl").addEventListener("click", function (e) {
    var a = e.target.dataset.a; if (!a) return;
    if (a === "m" || a === "f") G = a; else SKY = a;
    document.getElementById("scroll").scrollTop = 0;
    ctl(); pick(); paint();
  });
  document.getElementById("note").innerHTML = T.note;
  // load the app's own look library, in the same order as index.html
  fetch("../index.html").then(function (r) { return r.text(); }).then(function (html) {
    var srcs = [], re = /<script src="(look\/[^"]+)"/g, m;
    while ((m = re.exec(html))) srcs.push("../" + m[1]);
    (function next() {
      if (!srcs.length) { L = window.WX_LOOKS; ctl(); pick(); paint(); return; }
      var s = document.createElement("script"); s.src = srcs.shift(); s.onload = next; s.onerror = next; document.head.appendChild(s);
    })();
  });
</script>
</body>
